apiVersion: v1
kind: Service
metadata:
  name: forge-registry
  namespace: infra
spec:
  selector:
    app: forge-registry
  ports:
    - port: 5000
      name: registry
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-registry
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forge-registry
  template:
    metadata:
      labels:
        app: forge-registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forge-registry-pvc
  namespace: infra
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
