# NodePort services for external access to Ray Serve and Dashboard.
# KubeRay manages the ClusterIP services; these patch them to NodePort
# so external clients (Tailscale, local network) can reach them directly.
#
# Apply after RayService is running:
#   kubectl apply -f infra/k8s/traefik-ingress.yaml
#
# Ports:
#   80     → Traefik → Ray Serve (all AI routes via PathPrefix)
#   18080  → Ray Serve directly (bypass Traefik)
#   18265  → Ray Dashboard

# Traefik IngressRoute — clean URLs on port 80
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: forge-ingress
  namespace: ai-services
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: tech-noir-ray-serve-svc
          port: 8000

---
# Ray Dashboard via path prefix
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ray-dashboard
  namespace: ai-services
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/ray-dashboard`)
      kind: Rule
      middlewares:
        - name: strip-ray-dashboard
      services:
        - name: tech-noir-ray-head-svc
          port: 8265
          scheme: http

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-ray-dashboard
  namespace: ai-services
spec:
  stripPrefix:
    prefixes:
      - /ray-dashboard
