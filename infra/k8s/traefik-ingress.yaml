# Traefik IngressRoutes — unified routing for Ray + MCP services
#
# Apply: kubectl apply -f infra/k8s/traefik-ingress.yaml
#
# Routing (port 30080 via Tailscale):
#   /mcp/media   → Media Analysis MCP (mcp namespace)
#   /mcp/web   → Web Research MCP (mcp namespace)
#   /ray-dashboard/* → Ray Dashboard (ai-services namespace)
#   /*               → Ray Serve (catch-all, ai-services namespace)
#
# Direct access (bypass Traefik):
#   18080 → Ray Serve     18265 → Ray Dashboard

# Traefik IngressRoute — clean URLs on port 80
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: forge-ingress
  namespace: ai-services
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: tech-noir-ray-serve-svc
          port: 8000

---
# Ray Dashboard via path prefix
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ray-dashboard
  namespace: ai-services
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/ray-dashboard`)
      kind: Rule
      middlewares:
        - name: strip-ray-dashboard
      services:
        - name: tech-noir-ray-head-svc
          port: 8265

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-ray-dashboard
  namespace: ai-services
spec:
  stripPrefix:
    prefixes:
      - /ray-dashboard

---
# ─── MCP Services (mcp namespace) ────────────────────────────────────
# More specific prefixes match before the catch-all Ray route above.
# Paths are rewritten: /mcp/<service> → /mcp (MCP endpoint for FastMCP)

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mcp-ingress
  namespace: mcp
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/mcp/media`)
      kind: Rule
      middlewares:
        - name: mcp-media-rewrite
      services:
        - name: media-analysis-mcp
          port: 8001
    - match: PathPrefix(`/mcp/web`)
      kind: Rule
      middlewares:
        - name: mcp-web-rewrite
      services:
        - name: web-research-mcp
          port: 8327

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mcp-media-rewrite
  namespace: mcp
spec:
  replacePathRegex:
    regex: ^/mcp/media(/.*)?$
    replacement: /mcp

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mcp-web-rewrite
  namespace: mcp
spec:
  replacePathRegex:
    regex: ^/mcp/web(/.*)?$
    replacement: /mcp
