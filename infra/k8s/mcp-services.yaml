apiVersion: v1
kind: Namespace
metadata:
  name: mcp

---
# ─── Media Analysis MCP ────────────────────────────────────
# Bridges to the Docker container running on the host.
# K8s Service → Endpoints → host IP → Docker container.
apiVersion: v1
kind: Service
metadata:
  name: media-analysis-mcp
  namespace: mcp
spec:
  ports:
    - name: http
      port: 8001
---
apiVersion: v1
kind: Endpoints
metadata:
  name: media-analysis-mcp
  namespace: mcp
subsets:
  - addresses:
      - ip: 192.168.1.184
    ports:
      - name: http
        port: 8001

---
# ─── Web Research MCP ────────────────────────────────────
# Bridges to the web-research Docker Compose on the host.
# Port 8327 on the host maps to container port 8000.
apiVersion: v1
kind: Service
metadata:
  name: web-research-mcp
  namespace: mcp
spec:
  ports:
    - name: http
      port: 8327
---
apiVersion: v1
kind: Endpoints
metadata:
  name: web-research-mcp
  namespace: mcp
subsets:
  - addresses:
      - ip: 192.168.1.184
    ports:
      - name: http
        port: 8327
