apiVersion: apps/v1
kind: Deployment
metadata:
  name: crispasr
  namespace: ai-services
  labels:
    app: crispasr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crispasr
  template:
    metadata:
      labels:
        app: crispasr
    spec:
      hostAliases:
        - hostnames: [forge-reg.local]
          ip: 192.168.86.184
      containers:
        - name: crispasr
          image: ghcr.io/crispstrobe/crispasr:main-cuda-12
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: asr-api
          env:
            # FAST mode: Parakeet TDT 0.6B (default)
            # QUALITY mode: VibeVoice-7B (override via env or POST /load)
            - name: CRISPASR_MODEL
              value: "/models/asr/parakeet-tdt-0.6b-v3.gguf"
            - name: CRISPASR_BACKEND
              value: "parakeet"
            - name: CRISPASR_AUTO_DOWNLOAD
              value: "1"
            - name: CRISPASR_CACHE_DIR
              value: "/models/asr/cache"
          resources:
            limits:
              cpu: "4"
              memory: 32Gi  # Enough for VibeVoice-7B when switched
            requests:
              cpu: "2"
              memory: 8Gi
          volumeMounts:
            - mountPath: /models
              name: models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: asr-service
  namespace: ai-services
spec:
  selector:
    app: crispasr
  ports:
    - port: 8080
      targetPort: 8080
      name: asr-api
  clusterIP: None
