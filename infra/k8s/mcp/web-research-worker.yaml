# Celery workers + beat scheduler for Web Research MCP
# Workers handle background scraping tasks; beat runs periodic cleanup
# Database: shared Postgres at postgres.infra.svc.cluster.local (integrated mode)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-research-worker
  namespace: mcp
  labels:
    app: web-research-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-research-worker
  template:
    metadata:
      labels:
        app: web-research-worker
    spec:
      containers:
        - name: worker
          image: localhost/tech-noir/mcp-web-research:latest
          imagePullPolicy: Never
          command: ["celery", "-A", "src.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_PASSWORD
              value: mcp_local_dev
            - name: POSTGRES_DB
              value: mcp_server
            - name: POSTGRES_USER
              value: postgres
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/0
            - name: SEARXNG_URL
              value: http://searxng:8080
            - name: SEARXNG_URL
              value: http://searxng:8080
          resources:
            limits:
              memory: 3Gi
              cpu: "2"
            requests:
              memory: 1Gi
              cpu: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-research-beat
  namespace: mcp
  labels:
    app: web-research-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-research-beat
  template:
    metadata:
      labels:
        app: web-research-beat
    spec:
      containers:
        - name: beat
          image: localhost/tech-noir/mcp-web-research:latest
          imagePullPolicy: Never
          command: ["celery", "-A", "src.celery_app", "beat", "--loglevel=info"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shared-db-url
                  key: WEB_RESEARCH_DB_URL
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/0
          resources:
            limits:
              memory: 256Mi
            requests:
              memory: 128Mi
