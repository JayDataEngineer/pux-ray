# Web Research MCP Server — main FastAPI application
# Accessible via Traefik: /mcp/web/*
# Database: shared Postgres at postgres.infra.svc.cluster.local (deployed via task infra:deploy)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-research-mcp
  namespace: mcp
  labels:
    app: web-research-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-research-mcp
  template:
    metadata:
      labels:
        app: web-research-mcp
    spec:
      containers:
        - name: server
          image: forge-reg.local:30500/tech-noir/mcp-web-research:latest
          ports:
            - containerPort: 8000
          env:
            - name: MCP_PORT
              value: "8000"
            - name: POSTGRES_HOST
              value: postgres.infra.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-infra
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: web_research
            - name: POSTGRES_USER
              value: postgres
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/0
            - name: SEARXNG_URL
              value: http://searxng:8080
          resources:
            limits:
              memory: 8Gi
              cpu: "2"
            requests:
              memory: 2Gi
              cpu: "1"
          volumeMounts:
            - name: docs-config
              mountPath: /app/docs_config.yaml
              subPath: docs_config.yaml
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: docs-config
          configMap:
            name: docs-config
---
apiVersion: v1
kind: Service
metadata:
  name: web-research-mcp
  namespace: mcp
spec:
  selector:
    app: web-research-mcp
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: docs-config
  namespace: mcp
data:
  docs_config.yaml: |
    # Documentation sources for the web research MCP server.
    # Domains linked within llms.txt files are auto-discovered and allowed.
    - name: langchain
      llms_txt: https://docs.langchain.com/llms.txt
    - name: langgraph
      llms_txt: https://langchain-ai.github.io/langgraph/llms.txt
    - name: fastmcp
      llms_txt: https://gofastmcp.com/llms.txt
    - name: mcp-spec
      llms_txt: https://modelcontextprotocol.io/llms.txt
    - name: pydantic
      llms_txt: https://docs.pydantic.dev/llms.txt
    - name: pydantic-ai
      llms_txt: https://ai.pydantic.dev/llms.txt
    - name: docker
      llms_txt: https://docs.docker.com/llms.txt
    - name: nextjs
      llms_txt: https://nextjs.org/llms.txt
    - name: ai-sdk
      llms_txt: https://ai-sdk.dev/llms.txt
