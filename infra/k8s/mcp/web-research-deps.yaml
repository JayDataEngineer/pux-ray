# Dependencies for Web Research MCP: Redis, SearXNG
# PostgreSQL: shared infra at postgres.infra.svc.cluster.local (deployed via task infra:deploy)
---
# Redis — cache/broker for Celery
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: mcp
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            limits:
              memory: 256Mi
            requests:
              memory: 128Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: mcp
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
# SearXNG — privacy-respecting metasearch engine
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: mcp
  labels:
    app: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
        - name: searxng
          image: searxng/searxng:latest
          ports:
            - containerPort: 8080
          env:
            - name: SEARXNG_PORT
              value: "8080"
            - name: SEARXNG_BASE_URL
              value: "http://searxng:8080/"
          resources:
            limits:
              memory: 512Mi
            requests:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: mcp
spec:
  selector:
    app: searxng
  ports:
    - port: 8080
      targetPort: 8080
