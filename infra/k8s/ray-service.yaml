apiVersion: ray.io/v1
kind: RayService
metadata:
  name: tech-noir-ray
  namespace: ai-services
spec:
  serveConfigV2: |
    applications:
      # ─── CPU services (head node, always running) ─────────────────────
      - name: kokoro_tts
        import_path: serve_config:kokoro_tts
        route_prefix: /tts/kokoro
      - name: espeak_tts
        import_path: serve_config:espeak_tts
        route_prefix: /tts/espeak
      - name: faster_whisper
        import_path: serve_config:faster_whisper
        route_prefix: /asr/whisper

      # ─── GPU — gpu-services image ─────────────────────────────────────
      - name: vibevoice_asr
        import_path: serve_config:vibevoice_asr
        route_prefix: /asr/vibevoice
        deployments:
          - name: vibevoice_asr
            autoscaling_config: { min_replicas: 0, max_replicas: 1 }
            ray_actor_options: { num_gpus: 0, resources: { "GPU_services": 0.01 } }
      - name: qwen_asr
        import_path: serve_config:qwen_asr
        route_prefix: /asr/qwen
        deployments:
          - name: qwen_asr
            autoscaling_config: { min_replicas: 0, max_replicas: 1 }
            ray_actor_options: { num_gpus: 0, resources: { "GPU_services": 0.01 } }
      - name: index_tts
        import_path: serve_config:index_tts
        route_prefix: /tts/index-tts
        deployments:
          - name: index_tts
            autoscaling_config: { min_replicas: 0, max_replicas: 1 }
            ray_actor_options: { num_gpus: 0, resources: { "GPU_services": 0.01 } }

      # ─── GPU — ComfyUI image ──────────────────────────────────────────
      - name: comfyui
        import_path: serve_config:comfyui
        route_prefix: /comfyui
        deployments:
          - name: comfyui
            autoscaling_config: { min_replicas: 0, max_replicas: 1 }
            ray_actor_options: { num_gpus: 0, resources: { "ComfyUI_worker": 0.01 } }

      # ─── GPU — TRELLIS image ──────────────────────────────────────────
      - name: trellis
        import_path: serve_config:trellis
        route_prefix: /3d/trellis
        deployments:
          - name: trellis
            autoscaling_config: { min_replicas: 0, max_replicas: 1 }
            ray_actor_options: { num_gpus: 0, resources: { "TRELLIS_worker": 0.01 } }

      # ─── GPU — HY-Motion image ────────────────────────────────────────
      - name: hy_motion
        import_path: serve_config:hy_motion
        route_prefix: /3d/hy-motion
        deployments:
          - name: hy_motion
            autoscaling_config: { min_replicas: 0, max_replicas: 1 }
            ray_actor_options: { num_gpus: 0, resources: { "HYMotion_worker": 0.01 } }

      # ─── GPU — AniGen image ───────────────────────────────────────────
      - name: anigen
        import_path: serve_config:anigen
        route_prefix: /3d/anigen
        deployments:
          - name: anigen
            autoscaling_config: { min_replicas: 0, max_replicas: 1 }
            ray_actor_options: { num_gpus: 0, resources: { "AniGen_worker": 0.01 } }

      # ─── GPU — ACE-Step image ─────────────────────────────────────────
      - name: ace_step
        import_path: serve_config:ace_step
        route_prefix: /music/ace-step
        deployments:
          - name: ace_step
            autoscaling_config: { min_replicas: 0, max_replicas: 1 }
            ray_actor_options: { num_gpus: 0, resources: { "ACEStep_worker": 0.01 } }

      # ─── GPU — See-Through image ──────────────────────────────────────
      - name: see_through
        import_path: serve_config:see_through
        route_prefix: /creative/see-through
        deployments:
          - name: see_through
            autoscaling_config: { min_replicas: 0, max_replicas: 1 }
            ray_actor_options: { num_gpus: 0, resources: { "SeeThrough_worker": 0.01 } }

      # ─── GPU — GPT-SoVITS image ───────────────────────────────────────
      - name: gpt_sovits
        import_path: serve_config:gpt_sovits
        route_prefix: /tts/gpt-sovits
        deployments:
          - name: gpt_sovits
            autoscaling_config: { min_replicas: 0, max_replicas: 1 }
            ray_actor_options: { num_gpus: 0, resources: { "GPTSoVITS_worker": 0.01 } }

      # ─── GPU — Qwen-TTS image ─────────────────────────────────────────
      - name: qwen_tts
        import_path: serve_config:qwen_tts
        route_prefix: /tts/qwen-tts
        deployments:
          - name: qwen_tts
            autoscaling_config: { min_replicas: 0, max_replicas: 1 }
            ray_actor_options: { num_gpus: 0, resources: { "QwenTTS_worker": 0.01 } }

      # ─── GPU — VibeVoice TTS image ────────────────────────────────────
      - name: vibevoice
        import_path: serve_config:vibevoice
        route_prefix: /tts/vibevoice
        deployments:
          - name: vibevoice
            autoscaling_config: { min_replicas: 0, max_replicas: 1 }
            ray_actor_options: { num_gpus: 0, resources: { "VibeVoice_worker": 0.01 } }

      # ─── GPU — MOSS-SFX image ─────────────────────────────────────────
      - name: moss_sfx
        import_path: serve_config:moss_sfx
        route_prefix: /audio/moss-sfx
        deployments:
          - name: moss_soundeffect
            autoscaling_config: { min_replicas: 0, max_replicas: 1 }
            ray_actor_options: { num_gpus: 0, resources: { "MOSS_SFX_worker": 0.01 } }

      # ─── GPU — TangoFlux image ────────────────────────────────────────
      - name: tangoflux
        import_path: serve_config:tangoflux
        route_prefix: /audio/tangoflux
        deployments:
          - name: tangoflux
            autoscaling_config: { min_replicas: 0, max_replicas: 1 }
            ray_actor_options: { num_gpus: 0, resources: { "TangoFlux_worker": 0.01 } }

      # ─── GPU — Florence-2 image ───────────────────────────────────────
      - name: florence2
        import_path: serve_config:florence2
        route_prefix: /vision/florence2
        deployments:
          - name: florence2
            autoscaling_config: { min_replicas: 0, max_replicas: 1 }
            ray_actor_options: { num_gpus: 0, resources: { "Florence2_worker": 0.01 } }

      # ─── GPU — Phi-4-MM image ─────────────────────────────────────────
      - name: phi4mm
        import_path: serve_config:phi4mm
        route_prefix: /multimodal/phi4mm
        deployments:
          - name: phi4mm
            autoscaling_config: { min_replicas: 0, max_replicas: 1 }
            ray_actor_options: { num_gpus: 0, resources: { "Phi4MM_worker": 0.01 } }

  rayClusterConfig:
    rayVersion: '2.55.1'
    enableInTreeAutoscaling: true
    autoscalerOptions:
      version: 'v2'
    headGroupSpec:
      rayStartParams:
        dashboard-host: '0.0.0.0'
        num-cpus: '4'
      template:
        spec:
          containers:
            - name: ray-head
              image: localhost/tech-noir/gpu-services:latest
              imagePullPolicy: Never
              ports:
                - containerPort: 6379
                  name: gcs
                - containerPort: 8265
                  name: dashboard
                - containerPort: 8000
                  name: serve
              resources:
                limits:
                  cpu: '4'
                  memory: 8Gi
                requests:
                  cpu: '2'
                  memory: 4Gi
              volumeMounts:
                - name: config
                  mountPath: /app/config
                - name: models
                  mountPath: /models
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: ray-config
            - name: models
              persistentVolumeClaim:
                claimName: models-pvc
                readOnly: true

    workerGroupSpecs:
      - groupName: gpu-services
        replicas: 0
        minReplicas: 0
        maxReplicas: 1
        idleTimeoutSeconds: 300
        rayStartParams:
          num-gpus: '1'
          resources: '"{\"GPU_services\": 1}"'
        template:
          spec:
            initContainers:
              - name: model-sync
                image: localhost/tech-noir/model-sync:latest
                imagePullPolicy: Never
                env:
                  - name: MODELS
                    value: "asr.faster-whisper,asr.vibevoice-asr,tts.index-tts,tts.kokoro"
                  - name: MODELS_ROOT
                    value: /models
                volumeMounts:
                  - name: models
                    mountPath: /models
            runtimeClassName: nvidia
            containers:
              - name: ray-worker
                image: localhost/tech-noir/gpu-services:latest
                imagePullPolicy: Never
                readinessProbe:
                  exec:
                    command:
                      - python3
                      - -c
                      - "import urllib.request; urllib.request.urlopen('http://localhost:52365/api/local_raylet_healthz')"
                  initialDelaySeconds: 10
                  timeoutSeconds: 5
                  periodSeconds: 5
                  failureThreshold: 30
                resources:
                  limits:
                    nvidia.com/gpu: 1
                    cpu: '4'
                    memory: 24Gi
                  requests:
                    nvidia.com/gpu: 1
                    cpu: '2'
                    memory: 8Gi
                volumeMounts:
                  - name: config
                    mountPath: /app/config
                  - name: models
                    mountPath: /models
                    readOnly: true
            volumes:
              - name: config
                configMap:
                  name: ray-config
              - name: models
                persistentVolumeClaim:
                  claimName: models-pvc
                  readOnly: true

      - groupName: comfyui-workers
        replicas: 0
        minReplicas: 0
        maxReplicas: 1
        idleTimeoutSeconds: 300
        rayStartParams:
          num-gpus: '1'
          resources: '"{\"ComfyUI_worker\": 1}"'
        template:
          spec:
            initContainers:
              - name: model-sync
                image: localhost/tech-noir/model-sync:latest
                imagePullPolicy: Never
                env:
                  - name: MODELS_CATEGORY
                    value: "comfyui"
                  - name: MODELS_ROOT
                    value: /models
                volumeMounts:
                  - name: models
                    mountPath: /models
            runtimeClassName: nvidia
            containers:
              - name: ray-worker
                image: localhost/tech-noir/comfyui:latest
