apiVersion: ray.io/v1
kind: RayService
metadata:
  name: tech-noir-ray
  namespace: ai-services
spec:
  serveConfigV2: |
    http_options:
      port: 8000
    applications:
      # ─── Tier 1: All services lazy-loaded (scale to zero when idle) ────
      - name: kokoro_tts
        import_path: serve_config:kokoro_tts
        route_prefix: /tts/kokoro
        deployments:
          - name: kokoro_tts
            autoscaling_config: { min_replicas: 0, max_replicas: 1, downscale_delay_s: 60 }

      - name: espeak_tts
        import_path: serve_config:espeak_tts
        route_prefix: /tts/espeak
        deployments:
          - name: espeak_tts
            autoscaling_config: { min_replicas: 0, max_replicas: 1, downscale_delay_s: 60 }

      - name: faster_whisper
        import_path: serve_config:faster_whisper
        route_prefix: /asr/whisper
        deployments:
          - name: faster_whisper
            autoscaling_config: { min_replicas: 0, max_replicas: 1, downscale_delay_s: 60 }

      - name: faster_qwen3_tts
        import_path: serve_config:faster_qwen3_tts
        route_prefix: /tts/faster-qwen3-tts
        deployments:
          - name: faster_qwen3_tts
            autoscaling_config: { min_replicas: 0, max_replicas: 1, downscale_delay_s: 30 }
            ray_actor_options: { num_gpus: 0.20 }

      - name: index_tts
        import_path: serve_config:index_tts
        route_prefix: /tts/index-tts
        deployments:
          - name: index_tts
            autoscaling_config: { min_replicas: 0, max_replicas: 1, downscale_delay_s: 30 }
            ray_actor_options: { num_gpus: 0.10 }

      - name: vibevoice_cpp
        import_path: serve_config:vibevoice_cpp
        route_prefix: /tts/vibevoice-cpp
        deployments:
          - name: vibevoice_cpp
            autoscaling_config: { min_replicas: 0, max_replicas: 1, downscale_delay_s: 30 }
            ray_actor_options: { num_gpus: 0.10 }

      # LLM via llama.cpp (subprocess GGUF inference — loads model on first request)
      - name: llm
        import_path: serve_config:llm
        route_prefix: /llm
        deployments:
          - name: llm
            autoscaling_config: { min_replicas: 0, max_replicas: 1, downscale_delay_s: 60 }
            ray_actor_options: { num_gpus: 0.25 }

      # Master Router: exclusive GPU for heavy services (trellis, ace_step, comfyui, hy_motion)
      # Swaps models explicitly in VRAM to prevent OOM on single 4090
      - name: master_router
        import_path: serve_config:master_router
        route_prefix: /forge
        deployments:
          - name: master_router
            autoscaling_config: { min_replicas: 0, max_replicas: 1, downscale_delay_s: 30 }
            ray_actor_options: { num_gpus: 1.0 }

      # ─── Tier 3: Experimental (uncomment to enable individually) ──────
      # moss_soundeffect is served through master_router at /forge (not standalone).
      # - name: gpt_sovits
      #   import_path: serve_config:gpt_sovits
      #   route_prefix: /tts/gpt-sovits
      # - name: moss_sfx
      #   import_path: serve_config:moss_sfx
      #   route_prefix: /audio/moss-sfx
      # - name: vibevoice
      #   import_path: serve_config:vibevoice
      #   route_prefix: /tts/vibevoice

  rayClusterConfig:
    rayVersion: '2.55.1'
    enableInTreeAutoscaling: true
    autoscalerOptions:
      version: 'v2'
    headGroupSpec:
      rayStartParams:
        dashboard-host: '0.0.0.0'
        num-cpus: '4'
      template:
        spec:
          containers:
            - name: ray-head
              image: localhost/tech-noir/gpu-all:latest
              imagePullPolicy: Never
              ports:
                - containerPort: 6379
                  name: gcs
                - containerPort: 8265
                  name: dashboard
                - containerPort: 8000
                  name: serve
              env:
                - name: HF_HOME
                  value: /tmp/huggingface
                - name: HF_HUB_CACHE
                  value: /tmp/huggingface
                - name: TECH_NOIR_MODELS_ROOT
                  value: /models
              resources:
                limits:
                  cpu: '4'
                  memory: 8Gi
                requests:
                  cpu: '2'
                  memory: 4Gi
              volumeMounts:
                - name: config
                  mountPath: /app/config
                - name: models
                  mountPath: /models
                  readOnly: true
                - name: src
                  mountPath: /app/services
                  subPath: services
                - name: src
                  mountPath: /app/gateway
                  subPath: gateway
                - name: src
                  mountPath: /app/registry
                  subPath: registry
                - name: src
                  mountPath: /app/sdk
                  subPath: sdk
                - name: src
                  mountPath: /app/serve_config.py
                  subPath: infra/k8s/serve_config.py
          volumes:
            - name: config
              configMap:
                name: ray-config
            - name: models
              persistentVolumeClaim:
                claimName: models-pvc
                readOnly: true
            - name: src
              hostPath:
                path: /home/user/Documents/programs/ray
                type: Directory

    workerGroupSpecs:
      - groupName: gpu-workers
        replicas: 1
        minReplicas: 1
        maxReplicas: 1
        idleTimeoutSeconds: 300
        rayStartParams:
          num-gpus: '1'
        template:
          spec:
            initContainers:
              - name: model-sync
                image: localhost/tech-noir/model-sync:latest
                imagePullPolicy: Never
                env:
                  - name: MODELS_ROOT
                    value: /models
                  - name: MODELS
                    value: "audio.moss-soundeffect,tts.vibevoice-tts,tts.qwen3-tts,asr.vibevoice-asr"
                volumeMounts:
                  - name: models
                    mountPath: /models
            runtimeClassName: nvidia
            containers:
              - name: ray-worker
                image: localhost/tech-noir/gpu-all:latest
                imagePullPolicy: Never
                readinessProbe:
                  exec:
                    command:
                      - python3
                      - -c
                      - "import urllib.request; urllib.request.urlopen('http://localhost:52365/api/local_raylet_healthz')"
                  initialDelaySeconds: 30
                  timeoutSeconds: 5
                  periodSeconds: 5
                  failureThreshold: 30
                livenessProbe:
                  exec:
                    command:
                      - python3
                      - -c
                      - "import urllib.request; urllib.request.urlopen('http://localhost:52365/api/local_raylet_healthz')"
                  initialDelaySeconds: 120
                  timeoutSeconds: 5
                  periodSeconds: 10
                  failureThreshold: 30
                env:
                  - name: RAY_memory_usage_threshold
                    value: "0.95"
                  - name: HF_HOME
                    value: /tmp/huggingface
                  - name: HF_HUB_CACHE
                    value: /tmp/huggingface
                  - name: TECH_NOIR_MODELS_ROOT
                    value: /models
                resources:
                  limits:
                    nvidia.com/gpu: 1
                    cpu: '4'
                    memory: 48Gi
                  requests:
                    nvidia.com/gpu: 1
                    cpu: '2'
                    memory: 16Gi
                volumeMounts:
                  - name: config
                    mountPath: /app/config
                  - name: models
                    mountPath: /models
                    readOnly: true
                  - name: src
                    mountPath: /app/services
                    subPath: services
                  - name: src
                    mountPath: /app/gateway
                    subPath: gateway
                  - name: src
                    mountPath: /app/registry
                    subPath: registry
                  - name: src
                    mountPath: /app/sdk
                    subPath: sdk
                  - name: src
                    mountPath: /app/serve_config.py
                    subPath: infra/k8s/serve_config.py
            volumes:
              - name: config
                configMap:
                  name: ray-config
              - name: models
                persistentVolumeClaim:
                  claimName: models-pvc
              - name: src
                hostPath:
                  path: /home/user/Documents/programs/ray
                  type: Directory
