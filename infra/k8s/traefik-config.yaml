# Configure Traefik to use standard ports 80/443 instead of random NodePorts.
# k3s ships with Traefik as a Helm chart — this HelmChartConfig patches it.
#
# Apply:
#   kubectl apply -f infra/k8s/traefik-config.yaml
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  values:
    service:
      spec:
        type: NodePort
    ports:
      web:
        port: 80
        nodePort: 30080
        http2: true
      websecure:
        port: 443
        nodePort: 30443
