apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui
  namespace: ai-services
  labels:
    app: comfyui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comfyui
  template:
    metadata:
      labels:
        app: comfyui
    spec:
      runtimeClassName: nvidia
      containers:
        - name: comfyui
          image: docker.io/tech-noir/comfyui:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 18465
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: hf-token
                  optional: true
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: comfyui-cache
---
apiVersion: v1
kind: Service
metadata:
  name: comfyui
  namespace: ai-services
spec:
  selector:
    app: comfyui
  ports:
    - port: 18465
      targetPort: 18465
