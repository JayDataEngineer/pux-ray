# Grafana — unified dashboard for metrics + logs
#
# Pre-configured with VictoriaMetrics and Loki datasources
# Pre-loaded with k3s cluster, node, and Ray dashboards
#
# Tailscale: http://100.86.69.57:30080/grafana
# Direct:     http://100.86.69.57:3001

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: infra
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        url: http://victoriametrics.infra.svc.cluster.local:8428
        access: proxy
        isDefault: true
      - name: Loki
        type: loki
        url: http://loki.infra.svc.cluster.local:3100
        access: proxy

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: infra
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: infra
  annotations:
    k8s-sidecar-target-kind: ConfigMap
data:
  dashboards.yaml: |
    # Dashboards are imported via Grafana UI on first setup.
    # Go to Dashboards → Import → paste IDs:
    #   7249  — Kubernetes cluster overview
    #   1860  — Node exporter full (per-machine)
    #   6336  — Kubernetes pod resources
    #   16110 — Ray Serve cluster
    #   9628  — PostgreSQL

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: infra
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: infra
  labels:
    app: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/monitoring
                    operator: In
                    values:
                      - "true"
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.5.2
          ports:
            - containerPort: 3000
          env:
            - name: GF_SERVER_ROOT_URL
              value: "http://100.86.69.57:30080/grafana"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: ""
          resources:
            limits:
              memory: 256Mi
              cpu: "500m"
            requests:
              memory: 128Mi
              cpu: "100m"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-1860
              mountPath: /var/lib/grafana/dashboards/1860.json
              subPath: 1860.json
            - name: dashboard-7249
              mountPath: /var/lib/grafana/dashboards/7249.json
              subPath: 7249.json
            - name: dashboard-6336
              mountPath: /var/lib/grafana/dashboards/6336.json
              subPath: 6336.json
            - name: dashboard-16110
              mountPath: /var/lib/grafana/dashboards/16110.json
              subPath: 16110.json
            - name: dashboard-9628
              mountPath: /var/lib/grafana/dashboards/9628.json
              subPath: 9628.json
            - name: data
              mountPath: /var/lib/grafana
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboard-1860
          configMap:
            name: dashboard-1860
        - name: dashboard-7249
          configMap:
            name: dashboard-7249
        - name: dashboard-6336
          configMap:
            name: dashboard-6336
        - name: dashboard-16110
          configMap:
            name: dashboard-16110
        - name: dashboard-9628
          configMap:
            name: dashboard-9628
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: infra
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30031
  type: NodePort
