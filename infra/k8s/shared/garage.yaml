# Garage — lightweight S3-compatible object storage (Rust, ~27MB)
#
# Single-node mode (replication_mode: 1) for home server
# NodePort 30390 for S3 API over Tailscale
# Admin API available internally on port 3901
#
# Internal DNS: garage-s3.infra.svc.cluster.local:3900
# Tailscale:    100.86.69.57:30390

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: infra
data:
  garage.toml: |
    metadata_dir = "/data/meta"
    data_dir = "/data/data"
    replication_mode = "1"

    rpc_bind_addr = "[::]:3902"
    rpc_public_addr = "127.0.0.1:3902"

    [s3_api]
    s3_region = "tech-noir"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.tech-noir.local"

    [s3_web]
    bind_addr = "[::]:3903"
    root_domain = ".web.tech-noir.local"
    index = "index.html"

    [admin]
    api_bind_addr = "[::]:3901"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data
  namespace: infra
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
  namespace: infra
  labels:
    app: garage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v2.0.0
          args: ["server"]
          ports:
            - containerPort: 3900
              name: s3
            - containerPort: 3901
              name: admin
            - containerPort: 3902
              name: rpc
            - containerPort: 3903
              name: web
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: infra-credentials
                  key: GARAGE_RPC_SECRET
          resources:
            limits:
              memory: 256Mi
            requests:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: 3901
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3901
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: garage-config
        - name: data
          persistentVolumeClaim:
            claimName: garage-data

---
apiVersion: v1
kind: Service
metadata:
  name: garage-s3
  namespace: infra
spec:
  selector:
    app: garage
  ports:
    - name: s3
      port: 3900
      targetPort: 3900
      nodePort: 30390
    - name: admin
      port: 3901
      targetPort: 3901
  type: NodePort
