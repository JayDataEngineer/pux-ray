# Langfuse — LLM observability and tracing
#
# Connects to shared Postgres (database: langfuse)
# Accessible via Traefik at /langfuse
#
# Tailscale: http://100.86.69.57:30080/langfuse

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse
  namespace: infra
  labels:
    app: langfuse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse
  template:
    metadata:
      labels:
        app: langfuse
    spec:
      containers:
        - name: langfuse
          image: langfuse/langfuse:2
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shared-infra
                  key: LANGFUSE_DB_URL
            - name: NEXTAUTH_URL
              value: "http://100.86.69.57:30080/langfuse"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: shared-infra
                  key: LANGFUSE_SECRET_KEY
            - name: SALT
              valueFrom:
                secretKeyRef:
                  name: shared-infra
                  key: LANGFUSE_SALT
          resources:
            limits:
              memory: 512Mi
            requests:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: langfuse
  namespace: infra
spec:
  selector:
    app: langfuse
  ports:
    - port: 3000
      targetPort: 3000
