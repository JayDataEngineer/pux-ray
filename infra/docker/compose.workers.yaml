# Docker Compose for CUDA-heavy creative tool workers.
#
# Uses Docker Compose profiles for GPU exclusivity — only one worker
# runs at a time on a single-GPU machine.
#
# Start a worker:  docker compose --profile trellis up -d
# Stop a worker:   docker compose --profile trellis stop trellis-worker
# List running:    docker compose ps
# Build all:       docker compose build
#
# GPUScheduler manages which worker is active via docker compose commands.

services:
  trellis-worker:
    image: tech-noir/trellis-spz:latest
    container_name: trellis-worker
    ports:
      - "18401:8000"
    volumes:
      - ${MODELS_DIR:-/home/user/Documents/models}/3d/trellis:/models:ro
      - ${HOME:-/home/user}/.cache/huggingface:/root/.cache/huggingface
      - ${MODELS_DIR:-/home/user/Documents/models}/3d/trellis/dinov3/facebook/dinov3-vitl16-pretrain-lvd1689m:/home/user/Documents/models/3d/trellis/dinov3/facebook/dinov3-vitl16-pretrain-lvd1689m:ro
      - ${MODELS_DIR:-/home/user/Documents/models}/3d/trellis/rmbg/briaai/RMBG-2___0:/home/user/Documents/models/3d/trellis/rmbg/briaai/RMBG-2___0:ro
      - ${MODELS_DIR:-/home/user/Documents/models}/3d/trellis/cache:/tmp/hf_cache
    environment:
      - ATTN_BACKEND=xformers
      - HF_HOME=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - trellis
    restart: "no"

  anigen-worker:
    image: docker-anigen-worker:latest
    container_name: anigen-worker
    ports:
      - "18402:8000"
    volumes:
      - ${MODELS_DIR:-/home/user/Documents/models}/3d/anigen:/models:ro
    environment:
      - TOOL_NAME=anigen
      - PORT=18402
      - MODEL_PATH=/models/ckpts
      - HF_HOME=/models/cache/huggingface
      - HF_HUB_CACHE=/models/cache/huggingface/hub
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - anigen
    restart: "no"

  hymotion-worker:
    image: tech-noir/hymotion:latest
    container_name: hymotion-worker
    ports:
      - "18404:8000"
    volumes:
      - ${MODELS_DIR:-/home/user/Documents/models}/image-gen/comfyui/HY-Motion:/models/image-gen/comfyui/HY-Motion:ro
      - ${HOME:-/home/user}/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HYMOTION_MODEL_PATH=/models/image-gen/comfyui/HY-Motion/ckpts/tencent/HY-Motion-1.0
      - HF_HOME=/root/.cache/huggingface
      - USE_HF_MODELS=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - hymotion
    restart: "no"

  vibevoice-worker:
    image: tech-noir/vibevoice:latest
    container_name: vibevoice-worker
    ports:
      - "18403:8000"
    volumes:
      - ${MODELS_DIR:-/home/user/Documents/models}/tts/vibevoice:/models:ro
    environment:
      - TOOL_NAME=vibevoice
      - PORT=18403
      - MODEL_PATH=/models/VibeVoice-7B
      - HF_HOME=/models/cache/huggingface
      - HF_HUB_CACHE=/models/cache/huggingface/hub
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - vibevoice
    restart: "no"
