# Docker Compose for CUDA-heavy creative tool workers.
#
# Uses Docker Compose profiles for GPU exclusivity — only one worker
# runs at a time on a single-GPU machine.
#
# Start a worker:  docker compose --profile trellis up -d
# Stop a worker:   docker compose --profile trellis stop trellis-worker
# List running:    docker compose ps
# Build all:       docker compose build
#
# GPUScheduler manages which worker is active via docker compose commands.

services:
  trellis-worker:
    image: tech-noir/trellis-spz:latest
    container_name: trellis-worker
    ports:
      - "18401:8000"
    volumes:
      - ${MODELS_DIR:-/home/user/Documents/models}/3d/trellis:/models:ro
    environment:
      - TRELLIS_MODEL_ID=jetx/TRELLIS-image-large
      - ATTN_BACKEND=flash-attn
      - HF_HOME=/tmp/hf_cache
      - HF_HUB_CACHE=/tmp/hf_cache/hub
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - trellis
    restart: "no"

  anigen-worker:
    image: docker-anigen-worker:latest
    container_name: anigen-worker
    ports:
      - "18402:8000"
    volumes:
      - ${MODELS_DIR:-/home/user/Documents/models}/3d/anigen:/models:ro
    environment:
      - TOOL_NAME=anigen
      - PORT=18402
      - MODEL_PATH=/models/ckpts
      - HF_HOME=/models/cache/huggingface
      - HF_HUB_CACHE=/models/cache/huggingface/hub
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - anigen
    restart: "no"

  vibevoice-worker:
    image: tech-noir/vibevoice:latest
    container_name: vibevoice-worker
    ports:
      - "18403:8000"
    volumes:
      - ${MODELS_DIR:-/home/user/Documents/models}/tts/vibevoice:/models:ro
    environment:
      - TOOL_NAME=vibevoice
      - PORT=18403
      - MODEL_PATH=/models/VibeVoice-7B
      - HF_HOME=/models/cache/huggingface
      - HF_HUB_CACHE=/models/cache/huggingface/hub
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - vibevoice
    restart: "no"
