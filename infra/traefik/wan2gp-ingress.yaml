apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wan2gp-web
  namespace: mcp
spec:
  entryPoints:
    - web
  routes:
  - match: PathPrefix(`/editor`)
    kind: Rule
    services:
    - name: wan2gp-studio-web
      port: 3000
  - match: PathPrefix(`/v1`)
    kind: Rule
    services:
    - name: wan2gp-studio-mcp
      port: 8002
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wan2gp-api
  namespace: mcp
spec:
  entryPoints:
    - web
  routes:
  - match: PathPrefix(`/mcp`)
    kind: Rule
    services:
    - name: wan2gp-studio-mcp
      port: 8002
  - match: PathPrefix(`/forge`)
    kind: Rule
    services:
    - name: wan2gp-studio-mcp
      port: 8002
