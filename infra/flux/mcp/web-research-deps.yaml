# Dependencies for Web Research MCP: Redis, SearXNG
# PostgreSQL: shared infra at postgres.infra.svc.cluster.local (deployed via task infra:deploy)
---
# Redis — cache/broker for Celery
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: mcp
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            limits:
              memory: 256Mi
            requests:
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: mcp
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
# SearXNG — privacy-respecting metasearch engine
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: mcp
data:
  settings.yml: |
    use_default_settings: true
    server:
      limiter: false
      secret_key: "tech-noir-searxng-instance-key"
    search:
      formats:
        - json
      default_lang: en
      max_results: 20
      ban_time_on_fail: 10
      max_ban_time_on_fail: 120
      suspended_times:
        SearxEngineAccessDenied: 86400      # 1 day — IP blocked
        SearxEngineCaptcha: 86400           # 1 day — CAPTCHA challenge
        SearxEngineTooManyRequests: 3600    # 1 hour — rate limited
    outgoing:
      request_timeout: 1.5
      max_request_timeout: 2.5
    engines:
      # --- HIGH RELIABILITY (independent indices) ---
      - name: brave
        timeout: 1.5
        disabled: false
      - name: mojeek
        timeout: 1.2                        # Independent index, rarely blocks
        disabled: false
      - name: wikipedia
        timeout: 1.0                        # Never blocks
        disabled: false
      # --- MODERATE RELIABILITY ---
      - name: duckduckgo
        timeout: 1.5
        disabled: false
      - name: qwant
        timeout: 1.5
        disabled: false
      # --- HIGH RISK (fail-fast, prone to CAPTCHAs) ---
      - name: google
        timeout: 1.0
        disabled: false
      - name: bing
        timeout: 1.0
        disabled: false
      # --- DISABLED ---
      - name: ask
        disabled: true                      # Returns 404 every query
      - name: startpage
        disabled: true
      - name: google images
        disabled: true
      - name: google news
        disabled: true
      - name: google video
        disabled: true
      # --- REFERENCE (never blocks) ---
      - name: wikidata
        disabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: mcp
  labels:
    app: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
        - name: searxng
          image: searxng/searxng:2026.5.15-240f403d9
          ports:
            - containerPort: 8080
          env:
            - name: SEARXNG_PORT
              value: "8080"
            - name: SEARXNG_BASE_URL
              value: "http://searxng:8080/"
            - name: SEARXNG_SETTINGS_PATH
              value: "/etc/searxng/settings.yml"
          resources:
            limits:
              memory: 512Mi
            requests:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/searxng
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: searxng-config
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: mcp
spec:
  selector:
    app: searxng
  ports:
    - port: 8080
      targetPort: 8080
