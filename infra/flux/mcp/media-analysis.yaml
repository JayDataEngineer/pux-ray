# Media Analysis MCP Server — CPU inference (YOLOv8, Florence-2, SAM2, etc.)
# Accessible via Traefik: /mcp/media-analysis/*
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-analysis-mcp
  namespace: mcp
  labels:
    app: media-analysis-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-analysis-mcp
  template:
    metadata:
      labels:
        app: media-analysis-mcp
    spec:
      # nodeSelector:
      #   node-role.kubernetes.io/mcp: "true"
      containers:
        - name: server
          image: forge-reg.local:30500/tech-noir/mcp-media-analysis:latest
          ports:
            - containerPort: 8001
          env:
            - name: MEDIA_HOST
              value: "0.0.0.0"
            - name: MEDIA_PORT
              value: "8001"
            - name: MEDIA_DEVICE
              value: cpu
            - name: MEDIA_PROFILE
              value: standard
            - name: MEDIA_IDLE_TIMEOUT
              value: "1800"
            - name: MEDIA_ROUTER_ENABLED
              value: "false"
          resources:
            limits:
              memory: 4Gi
            requests:
              memory: 2Gi
          volumeMounts:
            - name: models
              mountPath: /app/models
          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: media-models
---
apiVersion: v1
kind: Service
metadata:
  name: media-analysis-mcp
  namespace: mcp
spec:
  selector:
    app: media-analysis-mcp
  ports:
    - port: 8001
      targetPort: 8001
