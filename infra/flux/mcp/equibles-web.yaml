# Equibles Web Portal — used ONLY for running EF Core migrations.
# The web portal's Program.cs calls ApplyMigrationsAsync() on startup.
#
# First-time setup and after upstream updates with new migrations:
#   kubectl scale deployment equibles-web --replicas=1 -n mcp
#   kubectl wait --for=condition=available deployment/equibles-web -n mcp --timeout=300s
#   kubectl scale deployment equibles-web --replicas=0 -n mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: equibles-web
  namespace: mcp
  labels:
    app: equibles-web
spec:
  replicas: 0  # Only scaled up for migrations
  selector:
    matchLabels:
      app: equibles-web
  template:
    metadata:
      labels:
        app: equibles-web
    spec:
      containers:
        - name: web
          image: forge-reg.local:30500/tech-noir/mcp-equibles-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: shared-infra
                  key: EQUIBLES_CONNECTION_STRING
            - name: Sec__ContactEmail
              valueFrom:
                secretKeyRef:
                  name: shared-infra
                  key: SEC_CONTACT_EMAIL
            - name: MinimumLogLevel
              value: "Information"
          resources:
            limits:
              memory: 512Mi
            requests:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: equibles-web
  namespace: mcp
spec:
  selector:
    app: equibles-web
  ports:
    - port: 8080
      targetPort: 8080
