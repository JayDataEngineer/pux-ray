apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Helm repositories (must be indexed before releases)
  - repositories/gitea.yaml
  - repositories/grafana.yaml
  - repositories/keda.yaml
  - repositories/kuberay.yaml
  - repositories/prometheus-community.yaml
  - repositories/cilium.yaml
  - repositories/traefik.yaml
  - repositories/victoriametrics.yaml
  - repositories/flux-operator.yaml
  # Helm releases
  - releases/kube-system/cilium.yaml
  - releases/kube-system/traefik.yaml
  - releases/ray-system/kuberay-operator.yaml
  - releases/infra/victoriametrics.yaml
  - releases/infra/grafana.yaml
  - releases/infra/loki.yaml
  - releases/infra/node-exporter.yaml
  - releases/infra/kube-state-metrics.yaml
  - releases/infra/flux-operator.yaml
  - releases/infra/flux-ui-nodeport.yaml
  # - releases/infra/keda.yaml  # KEDA CRD install issues — uncomment when fixed
  - releases/git/gitea.yaml
  # Custom charts (in-repo GitRepository-based)
  - releases/infra/forge-registry.yaml
  - releases/infra/overflow-gateway.yaml
  - releases/mcp/media-analysis-mcp.yaml
