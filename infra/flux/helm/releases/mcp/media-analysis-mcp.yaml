apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: media-analysis-mcp
  namespace: mcp
spec:
  interval: 5m
  suspend: true
  chart:
    spec:
      chart: ./infra/flux/charts/media-analysis-mcp
      sourceRef:
        kind: GitRepository
        name: tech-noir
        namespace: flux-system
  values:
    image:
      repository: forge-reg.local:30500/tech-noir/mcp-media-analysis
      tag: latest
    persistence:
      existingClaim: media-models
    resources:
      requests:
        memory: 2Gi
      limits:
        memory: 4Gi
