apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: media-analysis-mcp
  namespace: mcp
spec:
  interval: 5m
  chart:
    spec:
      chart: ./infra/flux/charts/media-analysis-mcp
      sourceRef:
        kind: GitRepository
        name: tech-noir
        namespace: flux-system
  values:
    image:
      repository: forge-reg.local:30500/tech-noir/mcp-media-analysis
      tag: latest
    persistence:
      existingClaim: media-models
    env:
      MEDIA_PROFILE: full
      MEDIA_PHI4_VISION_ENABLED: "true"
      MEDIA_IDLE_TIMEOUT: "1800"
      MEDIA_ROUTER_ENABLED: "false"
    resources:
      requests:
        memory: 2Gi
      limits:
        memory: 16Gi
