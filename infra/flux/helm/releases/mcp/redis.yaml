apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: mcp
spec:
  interval: 5m
  suspend: true
  chart:
    spec:
      chart: redis
      version: "25.5.3"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    architecture: standalone
    auth:
      enabled: false
    master:
      persistence:
        enabled: true
        size: 1Gi
        storageClassName: local-path
      resources:
        limits:
          memory: 256Mi
        requests:
          memory: 128Mi
