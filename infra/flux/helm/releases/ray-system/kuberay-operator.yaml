apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kuberay-operator
  namespace: ray-system
spec:
  interval: 5m
  chart:
    spec:
      chart: kuberay-operator
      version: "1.3.x"
      sourceRef:
        kind: HelmRepository
        name: kuberay
        namespace: flux-system
  values:
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
