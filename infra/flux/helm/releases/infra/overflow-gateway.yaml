apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: overflow-gateway
  namespace: infra
spec:
  interval: 5m
  chart:
    spec:
      chart: ./infra/flux/charts/overflow-gateway
      sourceRef:
        kind: GitRepository
        name: tech-noir
        namespace: flux-system
  values:
    image:
      repository: forge-registry.infra.svc.cluster.local:5000/tech-noir/overflow-gateway
      tag: "latest"
    env:
      LOCAL_RAY_URL: http://tech-noir-ray-serve-svc.ai-services.svc.cluster.local:8000
