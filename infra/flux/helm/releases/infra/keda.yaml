apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: keda
spec:
  interval: 1h
  chart:
    spec:
      chart: keda
      sourceRef:
        kind: HelmRepository
        name: keda
        namespace: flux-system
  values:
    resources:
      operator:
        limits:
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 128Mi
      metricServer:
        limits:
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 64Mi
