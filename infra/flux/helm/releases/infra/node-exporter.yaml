apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-exporter
  namespace: infra
spec:
  interval: 5m
  chart:
    spec:
      chart: prometheus-node-exporter
      version: "4.55.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    service:
      port: 9100
    resources:
      limits:
        memory: 64Mi
        cpu: "100m"
      requests:
        memory: 32Mi
        cpu: "50m"
