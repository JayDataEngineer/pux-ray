# Flux Operator Web UI — NodePort for direct access
# The Helm chart only creates ClusterIP; this exposes port 9080 on NodePort 30090.
apiVersion: v1
kind: Service
metadata:
  name: flux-web
  namespace: flux-system
  labels:
    app.kubernetes.io/name: flux-operator
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: flux-operator
  ports:
    - name: http-web
      port: 9080
      targetPort: http-web
      nodePort: 30090
