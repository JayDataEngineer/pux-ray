apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: infra
spec:
  interval: 5m
  chart:
    spec:
      chart: kube-state-metrics
      version: "7.3.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    resources:
      limits:
        memory: 256Mi
        cpu: "200m"
      requests:
        memory: 128Mi
        cpu: "100m"
