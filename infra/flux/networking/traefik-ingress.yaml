---
# Forge Registry — TCP route for container image push/pull
# Docker pushes to 100.86.69.57:30500, Traefik routes to forge-registry:5000.

apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: forge-registry
  namespace: infra
spec:
  entryPoints:
    - registry
  routes:
    - match: HostSNI(`*`)
      services:
        - name: forge-registry
          port: 5000

---
# ComfyUI WebSocket — direct to subprocess (persistent connections)
# Matched before the HTTP catch-all for correct WS routing.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: comfyui-ws-ingress
  namespace: ai-services
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/comfyui/ws`)
      kind: Rule
      middlewares:
        - name: comfyui-rewrite
      services:
        - name: gpu-worker-subprocess
          port: 18465

---
# ComfyUI HTTP — through api-ingress (auto-loads via Forge on first request)
# Full path preserved — api-ingress expects /comfyui/... routes.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: comfyui-ingress
  namespace: ai-services
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/comfyui`)
      kind: Rule
      services:
        - name: tech-noir-ray-serve-svc
          port: 8000

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: comfyui-rewrite
  namespace: ai-services
spec:
  stripPrefix:
    prefixes:
      - /comfyui

