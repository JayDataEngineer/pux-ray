---
# Forge Registry — TCP route for container image push/pull
# Docker pushes to 100.86.69.57:30500, Traefik routes to forge-registry:5000.

apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: forge-registry
  namespace: infra
spec:
  entryPoints:
    - registry
  routes:
    - match: HostSNI(`*`)
      services:
        - name: forge-registry
          port: 5000

