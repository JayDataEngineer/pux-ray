# Traefik IngressRoutes — unified routing for Ray + MCP + Infra services
#
# Apply: kubectl apply -f infra/k8s/traefik-ingress.yaml
#
# All services accessible via: http://100.86.69.57:30080/<route>
# Port 30080 is Traefik's NodePort (avoids common port conflicts).
#
# Routing:
#   /git/*            → Gitea (self-hosted Git + CI)
#   /overflow/*       → Overflow Gateway (cloud burst proxy)
#   /ray-dashboard/*  → Ray Dashboard
#   /mcp/media/*      → Media Analysis MCP
#   /mcp/web/*        → Web Research MCP
#   /mcp/equibles/*   → Equibles Financial MCP
#   /langfuse/*       → Langfuse
#   /infisical/*      → Infisical
#   /grafana/*        → Grafana
#   /*                → Ray Serve (catch-all)
#
# Ray Serve uses tech-noir-ray-serve-svc (KubeRay-managed) which always
# targets the active cluster. ray-serve-proxy was removed because its static
# selector matched both active and pending clusters during rolling updates.

# Gitea — self-hosted Git + Actions CI
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitea-ingress
  namespace: git
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/git`)
      kind: Rule
      middlewares:
        - name: gitea-rewrite
      services:
        - name: gitea-http
          port: 3000

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gitea-rewrite
  namespace: git
spec:
  stripPrefix:
    prefixes:
      - /git

---
# Traefik IngressRoute — catch-all Ray Serve
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: forge-ingress
  namespace: ai-services
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: tech-noir-ray-serve-svc
          port: 8000

---
# Ray Dashboard via path prefix
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ray-dashboard
  namespace: ai-services
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/ray-dashboard`)
      kind: Rule
      middlewares:
        - name: strip-ray-dashboard
      services:
        - name: ray-dashboard
          port: 8265

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-ray-dashboard
  namespace: ai-services
spec:
  stripPrefix:
    prefixes:
      - /ray-dashboard

---
# ─── MCP Services (mcp namespace) ────────────────────────────────────
# More specific prefixes match before the catch-all Ray route above.
# Paths are rewritten: /mcp/<service> → /mcp (MCP endpoint for FastMCP)

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mcp-ingress
  namespace: mcp
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/mcp/media`)
      kind: Rule
      middlewares:
        - name: mcp-media-rewrite
      services:
        - name: media-analysis-mcp
          port: 8001
    - match: PathPrefix(`/mcp/web`)
      kind: Rule
      middlewares:
        - name: mcp-web-rewrite
      services:
        - name: web-research-mcp
          port: 8000
    - match: PathPrefix(`/mcp/equibles`)
      kind: Rule
      middlewares:
        - name: mcp-equibles-rewrite
      services:
        - name: equibles-mcp
          port: 8080
    - match: PathPrefix(`/mcp/wan2gp-studio`)
      kind: Rule
      middlewares:
        - name: mcp-wan2gp-studio-rewrite
      services:
        - name: wan2gp-studio-mcp
          port: 8002
    - match: PathPrefix(`/studio`)
      kind: Rule
      middlewares:
        - name: studio-rewrite
      services:
        - name: wan2gp-studio-web
          port: 3000

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mcp-media-rewrite
  namespace: mcp
spec:
  replacePathRegex:
    regex: ^/mcp/media(/.*)?$
    replacement: /mcp

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mcp-web-rewrite
  namespace: mcp
spec:
  replacePathRegex:
    regex: ^/mcp/web(/.*)?$
    replacement: /mcp

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mcp-equibles-rewrite
  namespace: mcp
spec:
  replacePathRegex:
    regex: ^/mcp/equibles(/.*)?$
    replacement: /mcp

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mcp-wan2gp-studio-rewrite
  namespace: mcp
spec:
  replacePathRegex:
    regex: ^/mcp/wan2gp-studio(/.*)?$
    replacement: /mcp

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: studio-rewrite
  namespace: mcp
spec:
  stripPrefix:
    prefixes:
      - /studio

