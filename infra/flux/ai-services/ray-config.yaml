apiVersion: v1
kind: ConfigMap
metadata:
  name: ray-config
  namespace: ai-services
data:
  local.yaml: |
    models_root: /models
    secrets:
      hf_token: null
    binaries:
      espeak_ng: espeak-ng
    services:
      comfyui:
        port: 18465
    creative:
      trellis: {}
      anigen:
        docker_image: null
      ace_step:
        docker_image: null
  model_registry.yaml: |
    llm:
      qwen3.6-27b-ud-q4_k_xl:
        path: llm/Qwen3.6-27B-UD-Q4_K_XL.gguf
        device: gpu
      qwen3.6-27b-iq4_nl:
        path: llm/Qwen3.6-27B-IQ4_NL.gguf
        device: gpu
    tts:
      espeak-ng:
        path: tts/espeak-ng/
        device: cpu
      kokoro:
        path: tts/kokoro/
        device: cpu
      index-tts:
        path: tts/index-tts/
        device: gpu
      qwen3-tts:
        path: tts/qwen3-tts-12hz-1.7b-customvoice/
        device: gpu
    asr:
      faster-whisper:
        path: asr/faster-whisper/
        device: cpu
      qwen-asr:
        path: asr/qwen-asr/
        device: gpu
      vibevoice-asr:
        path: asr/vibevoice-asr/
        device: gpu
    vision_models:
      florence2-large-ft:
        path: vision/florence-2-large-ft/
        device: gpu
    multimodal:
      phi4-multimodal:
        path: multimodal/phi4-multimodal-instruct/
        device: gpu
    audio:
      ace-step:
        path: audio/acestep/
        device: gpu
      moss-soundeffect:
        path: audio/moss-soundeffect/
        device: gpu
      tangoflux:
        path: audio/tangoflux/
        device: gpu
