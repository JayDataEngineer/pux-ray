# Dedicated Ray Serve proxy service — targets head node only
#
# The KubeRay-managed serve service (tech-noir-ray-serve-svc) includes both
# head and worker endpoints, but the HTTP proxy only runs on the head node.
# This causes 502s when Traefik load-balances to the worker.
#
# This service uses ray.io/node-type: head to route only to the serve proxy.
# Traefik should reference this service instead of the KubeRay-managed one.
#
apiVersion: v1
kind: Service
metadata:
  name: ray-serve-proxy
  namespace: ai-services
spec:
  selector:
    app.kubernetes.io/name: tech-noir-ray-head
  ports:
    - name: serve
      port: 8000
      targetPort: 8000
