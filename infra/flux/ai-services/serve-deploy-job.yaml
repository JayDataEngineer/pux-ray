apiVersion: batch/v1
kind: Job
metadata:
  name: serve-deploy
  namespace: ai-services
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: deploy
          image: forge-reg.local:30500/tech-noir/model-sync:latest
          command:
            - python3
            - -c
            - |
              import json, os, time, urllib.request, yaml

              CONFIG = """http_options:
                port: 8000
              applications:
                - name: forge
                  import_path: serve_config:forge
                  route_prefix: /forge
                  deployments:
                    - name: forge
                      autoscaling_config: { min_replicas: 0, max_replicas: 1, downscale_delay_s: 120 }
                - name: playground
                  import_path: serve_config:playground
                  route_prefix: /playground
                  deployments:
                    - name: playground
                      autoscaling_config: { min_replicas: 0, max_replicas: 1, downscale_delay_s: 30 }
                - name: api-ingress
                  import_path: serve_config:api_ingress
                  route_prefix: /
                  deployments:
                    - name: api-ingress
                      autoscaling_config: { min_replicas: 1, max_replicas: 1 }
              """

              svc = "http://tech-noir-ray-raycluster-dn7x9-head-svc.ai-services.svc.cluster.local:8265"

              for i in range(60):
                try:
                  r = urllib.request.urlopen(f"{svc}/api/serve/applications/", timeout=5)
                  if r.status < 500:
                    break
                except Exception:
                  pass
                time.sleep(5)
              else:
                print("timed out waiting for dashboard", flush=True)
                raise SystemExit(1)

              data = json.dumps(yaml.safe_load(CONFIG)).encode()
              req = urllib.request.Request(
                  f"{svc}/api/serve/applications/",
                  data=data,
                  method="PUT",
                  headers={"Content-Type": "application/json"},
              )
              resp = urllib.request.urlopen(req)
              print(f"serve deploy {resp.status}: {resp.read().decode()[:500]}", flush=True)
