apiVersion: ray.io/v1
kind: RayService
metadata:
  name: tech-noir-ray
  namespace: ai-services
spec:
  serveConfigV2: |
    http_options:
      host: 0.0.0.0
      port: 8000
    applications:
      # ─── Forge — VRAM-aware GPU manager (Wan2GP + ComfyUI + LLM + all models) ──
      - name: forge
        import_path: serve_config:forge
        route_prefix: /forge
        deployments:
          - name: forge
            autoscaling_config: { min_replicas: 1, max_replicas: 1, target_ongoing_requests: 1, downscale_delay_s: 600 }

      # Workflow Engine — CPU-only DAG orchestrator
      - name: workflow-engine
        import_path: serve_config:workflow_engine
        route_prefix: /wf-internal
        deployments:
          - name: workflow_engine
            autoscaling_config: { min_replicas: 1, max_replicas: 1, target_ongoing_requests: 10 }

      # Playground UI (interactive service playground — TNAP-driven form for all services)
      - name: playground
        import_path: serve_config:playground
        route_prefix: /playground
        deployments:
          - name: playground
            autoscaling_config: { min_replicas: 0, max_replicas: 1, downscale_delay_s: 30 }

      # API Ingress — catch-all gateway (/health, /status, /v1/*, /dashboard, /studio)
      # LAST app — Ray Serve matches most-specific route_prefix first.
      - name: api-ingress
        import_path: serve_config:api_ingress
        route_prefix: /
        deployments:
          - name: api-ingress
            autoscaling_config: { min_replicas: 1, max_replicas: 1 }

      # ─── Tier 3: Not yet deployed (add to serve_config + uncomment to enable) ──
      # - name: gpt_sovits
      #   import_path: serve_config:gpt_sovits
      #   route_prefix: /tts/gpt-sovits

  rayClusterConfig:
    rayVersion: '2.55.1'
    headGroupSpec:
      rayStartParams:
        dashboard-host: '0.0.0.0'
        num-cpus: '4'
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tech-noir-ray-head
        spec:
          containers:
            - name: ray-head
              image: forge-reg.local:30500/tech-noir/gpu-all:natten-0.21.5
              imagePullPolicy: IfNotPresent
              ports:
                - containerPort: 6379
                  name: gcs
                - containerPort: 8265
                  name: dashboard
                - containerPort: 8000
                  name: serve
              readinessProbe:
                httpGet:
                  path: /api/cluster_status
                  port: 8265
                initialDelaySeconds: 30
                timeoutSeconds: 5
                periodSeconds: 5
                failureThreshold: 30
              livenessProbe:
                httpGet:
                  path: /api/cluster_status
                  port: 8265
                initialDelaySeconds: 120
                timeoutSeconds: 5
                periodSeconds: 10
                failureThreshold: 30
              env:
                - name: HF_HOME
                  value: /tmp/huggingface
                - name: HF_HUB_CACHE
                  value: /tmp/huggingface
                - name: TECH_NOIR_MODELS_ROOT
                  value: /models
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: shared-infra
                      key: HF_TOKEN
                      optional: true
              resources:
                limits:
                  cpu: '4'
                  memory: 8Gi
                requests:
                  cpu: '2'
                  memory: 4Gi
              volumeMounts:
                - name: src
                  mountPath: /app/config/model_registry.yaml
                  subPath: config/model_registry.yaml
                - name: src
                  mountPath: /app/config/workflows
                  subPath: config/workflows
                - name: config
                  mountPath: /app/config/local.yaml
                  subPath: local.yaml
                - name: models
                  mountPath: /models
                - name: src
                  mountPath: /app/services
                  subPath: services
                - name: src
                  mountPath: /app/gateway
                  subPath: gateway
                - name: src
                  mountPath: /app/registry
                  subPath: registry
                - name: src
                  mountPath: /app/sdk
                  subPath: sdk
                - name: src
                  mountPath: /app/vendor
                  subPath: vendor
                - name: src
                  mountPath: /app/serve_config.py
                  subPath: infra/k8s/serve_config.py
                - name: src
                  mountPath: /app/serve_deploy.py
                  subPath: infra/k8s/serve_deploy.py
                - name: lance-src
                  mountPath: /opt/lance
                - name: lance-quant
                  mountPath: /opt/lance-quant
          volumes:
            - name: config
              configMap:
                name: ray-config
            - name: models
              persistentVolumeClaim:
                claimName: models-pvc
            - name: src
              hostPath:
                path: /home/user/Documents/programs/ray
                type: Directory
            - name: lance-src
              hostPath:
                path: /opt/lance
                type: Directory
            - name: lance-quant
              hostPath:
                path: /opt/lance-quant
                type: Directory

    workerGroupSpecs:
      - groupName: gpu-workers
        replicas: 1
        minReplicas: 1
        maxReplicas: 1
        rayStartParams:
          num-gpus: '1'
        template:
          spec:
            initContainers:
              - name: model-sync
                image: forge-reg.local:30500/tech-noir/model-sync:latest
                imagePullPolicy: IfNotPresent
                env:
                  - name: MODELS_ROOT
                    value: /models
                  - name: MODELS
                    value: "audio.moss-soundeffect,tts.vibevoice-tts,tts.qwen3-tts,asr.vibevoice-asr,vibevoice-cpp,comfyui.diffusion-klein-4b-q8,comfyui.vae-flux2"
                volumeMounts:
                  - name: models
                    mountPath: /models
            runtimeClassName: nvidia
            containers:
              - name: ray-worker
                image: forge-reg.local:30500/tech-noir/gpu-all:natten-0.21.5
                imagePullPolicy: IfNotPresent
                ports:
                  - containerPort: 18465
                    name: comfyui
                  - containerPort: 18399
                    name: llm
                readinessProbe:
                  exec:
                    command:
                      - python3
                      - -c
                      - "import urllib.request; urllib.request.urlopen('http://localhost:52365/api/local_raylet_healthz')"
                  initialDelaySeconds: 30
                  timeoutSeconds: 5
                  periodSeconds: 5
                  failureThreshold: 30
                livenessProbe:
                  exec:
                    command:
                      - python3
                      - -c
                      - "import urllib.request; urllib.request.urlopen('http://localhost:52365/api/local_raylet_healthz')"
                  initialDelaySeconds: 120
                  timeoutSeconds: 5
                  periodSeconds: 10
                  failureThreshold: 30
                env:
                  - name: RAY_memory_usage_threshold
                    value: "0.95"
                  - name: PYTORCH_ALLOC_CONF
                    value: "expandable_segments:True"
                  - name: HF_HOME
                    value: /tmp/huggingface
                  - name: HF_HUB_CACHE
                    value: /tmp/huggingface/hub
                  - name: TECH_NOIR_MODELS_ROOT
                    value: /models
                  - name: HF_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: shared-infra
                        key: HF_TOKEN
                        optional: true
                resources:
                  limits:
                    nvidia.com/gpu: 1
                    cpu: '4'
                    memory: 48Gi
                  requests:
                    nvidia.com/gpu: 1
                    cpu: '2'
                    memory: 16Gi
                volumeMounts:
                  - name: src
                    mountPath: /app/config/model_registry.yaml
                    subPath: config/model_registry.yaml
                  - name: src
                    mountPath: /app/config/workflows
                    subPath: config/workflows
                  - name: src
                    mountPath: /opt/ComfyUI/user/default/workflows/
                    subPath: config/workflows/comfyui
                  - name: config
                    mountPath: /app/config/local.yaml
                    subPath: local.yaml
                  - name: models
                    mountPath: /models
                  - name: src
                    mountPath: /app/services
                    subPath: services
                  - name: src
                    mountPath: /app/gateway
                    subPath: gateway
                  - name: src
                    mountPath: /app/registry
                    subPath: registry
                  - name: src
                    mountPath: /app/sdk
                    subPath: sdk
                  - name: src
                    mountPath: /app/serve_config.py
                    subPath: infra/k8s/serve_config.py
                  - name: src
                    mountPath: /opt/wan2gp
                    subPath: opt/wan2gp
                  - name: src
                    mountPath: /opt/vendor
                    subPath: vendor
                  - name: lance-src
                    mountPath: /opt/lance
                  - name: lance-quant
                    mountPath: /opt/lance-quant
            volumes:
              - name: config
                configMap:
                  name: ray-config
              - name: models
                persistentVolumeClaim:
                  claimName: models-pvc
              - name: src
                hostPath:
                  path: /home/user/Documents/programs/ray
                  type: Directory
              - name: lance-src
                hostPath:
                  path: /opt/lance
                  type: Directory
              - name: lance-quant
                hostPath:
                  path: /opt/lance-quant
                  type: Directory
