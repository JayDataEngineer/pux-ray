apiVersion: ray.io/v1
kind: RayService
metadata:
  name: tech-noir-ray
  namespace: ai-services
spec:
  serveConfigV2: |
    http_options:
      port: 8000
    applications:
      # ─── Tier 1: All services lazy-loaded (scale to zero when idle) ────
      - name: kokoro_tts
        import_path: serve_config:kokoro_tts
        route_prefix: /tts/kokoro
        deployments:
          - name: kokoro_tts
            autoscaling_config: { min_replicas: 0, max_replicas: 1, downscale_delay_s: 60 }

      - name: espeak_tts
        import_path: serve_config:espeak_tts
        route_prefix: /tts/espeak
        deployments:
          - name: espeak_tts
            autoscaling_config: { min_replicas: 0, max_replicas: 1, downscale_delay_s: 60 }

      - name: faster_whisper
        import_path: serve_config:faster_whisper
        route_prefix: /asr/whisper
        deployments:
          - name: faster_whisper
            autoscaling_config: { min_replicas: 0, max_replicas: 1, downscale_delay_s: 60 }

      - name: faster_qwen3_tts
        import_path: serve_config:faster_qwen3_tts
        route_prefix: /tts/faster-qwen3-tts
        deployments:
          - name: faster_qwen3_tts
            autoscaling_config: { min_replicas: 0, max_replicas: 1, downscale_delay_s: 30 }
            ray_actor_options: { num_gpus: 0.20 }

      - name: index_tts
        import_path: serve_config:index_tts
        route_prefix: /tts/index-tts
        deployments:
          - name: index_tts
            autoscaling_config: { min_replicas: 0, max_replicas: 1, downscale_delay_s: 30 }
            ray_actor_options: { num_gpus: 0.10 }

      - name: vibevoice_cpp_gpu
        import_path: serve_config:vibevoice_cpp_gpu
        route_prefix: /tts/vibevoice-cpp-gpu
        deployments:
          - name: vibevoice_cpp_gpu
            autoscaling_config: { min_replicas: 0, max_replicas: 1, downscale_delay_s: 30 }
            ray_actor_options: { num_gpus: 0.10 }

      - name: vibevoice_cpp_cpu
        import_path: serve_config:vibevoice_cpp_cpu
        route_prefix: /tts/vibevoice-cpp-cpu
        deployments:
          - name: vibevoice_cpp_cpu
            autoscaling_config: { min_replicas: 0, max_replicas: 1, downscale_delay_s: 60 }

      # Heavy GPU services — Master Router with exclusive GPU access
      # All heavy services (trellis, ace_step, comfyui, hy_motion,
      # moss_soundeffect, anigen, see_through, llm) route through /forge.
      # The router claims num_gpus: 1.0 and swaps models to prevent VRAM OOM.
      - name: forge
        import_path: serve_config:forge
        route_prefix: /forge
        deployments:
          - name: master_router
            autoscaling_config: { min_replicas: 0, max_replicas: 1, downscale_delay_s: 120 }

      # Playground UI (interactive service playground — TNAP-driven form for all services)
      - name: playground
        import_path: serve_config:playground
        route_prefix: /playground
        deployments:
          - name: playground
            autoscaling_config: { min_replicas: 0, max_replicas: 1, downscale_delay_s: 30 }

      # ─── Tier 3: Not yet deployed (add to serve_config + uncomment to enable) ──
      # - name: gpt_sovits
      #   import_path: serve_config:gpt_sovits
      #   route_prefix: /tts/gpt-sovits

  rayClusterConfig:
    rayVersion: '2.55.1'
    headGroupSpec:
      rayStartParams:
        dashboard-host: '0.0.0.0'
        num-cpus: '4'
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tech-noir-ray-head
        spec:
          containers:
            - name: ray-head
              image: forge-reg/tech-noir/gpu-all:latest

              ports:
                - containerPort: 6379
                  name: gcs
                - containerPort: 8265
                  name: dashboard
                - containerPort: 8000
                  name: serve
              env:
                - name: HF_HOME
                  value: /tmp/huggingface
                - name: HF_HUB_CACHE
                  value: /tmp/huggingface
                - name: TECH_NOIR_MODELS_ROOT
                  value: /models
              resources:
                limits:
                  cpu: '4'
                  memory: 8Gi
                requests:
                  cpu: '2'
                  memory: 4Gi
              volumeMounts:
                - name: src
                  mountPath: /app/config/model_registry.yaml
                  subPath: config/model_registry.yaml
                - name: config
                  mountPath: /app/config/local.yaml
                  subPath: local.yaml
                - name: models
                  mountPath: /models
                  readOnly: true
                - name: src
                  mountPath: /app/services
                  subPath: services
                - name: src
                  mountPath: /app/gateway
                  subPath: gateway
                - name: src
                  mountPath: /app/registry
                  subPath: registry
                - name: src
                  mountPath: /app/sdk
                  subPath: sdk
                - name: src
                  mountPath: /app/serve_config.py
                  subPath: infra/k8s/serve_config.py
          volumes:
            - name: config
              configMap:
                name: ray-config
            - name: models
              persistentVolumeClaim:
                claimName: models-pvc
                readOnly: true
            - name: src
              hostPath:
                path: /home/user/Documents/programs/ray
                type: Directory

    workerGroupSpecs:
      - groupName: gpu-workers
        replicas: 1
        minReplicas: 1
        maxReplicas: 1
        rayStartParams:
          num-gpus: '1'
        template:
          spec:
            initContainers:
              - name: model-sync
                image: forge-reg/tech-noir/model-sync:latest
                env:
                  - name: MODELS_ROOT
                    value: /models
                  - name: MODELS
                    value: "audio.moss-soundeffect,tts.vibevoice-tts,tts.qwen3-tts,asr.vibevoice-asr,vibevoice-cpp,multimodal.phi4-multimodal"
                volumeMounts:
                  - name: models
                    mountPath: /models
            runtimeClassName: nvidia
            containers:
              - name: ray-worker
                image: forge-reg/tech-noir/gpu-all:latest
                readinessProbe:
                  exec:
                    command:
                      - python3
                      - -c
                      - "import urllib.request; urllib.request.urlopen('http://localhost:52365/api/local_raylet_healthz')"
                  initialDelaySeconds: 30
                  timeoutSeconds: 5
                  periodSeconds: 5
                  failureThreshold: 30
                livenessProbe:
                  exec:
                    command:
                      - python3
                      - -c
                      - "import urllib.request; urllib.request.urlopen('http://localhost:52365/api/local_raylet_healthz')"
                  initialDelaySeconds: 120
                  timeoutSeconds: 5
                  periodSeconds: 10
                  failureThreshold: 30
                env:
                  - name: RAY_memory_usage_threshold
                    value: "0.95"
                  - name: HF_HOME
                    value: /tmp/huggingface
                  - name: HF_HUB_CACHE
                    value: /tmp/huggingface
                  - name: TECH_NOIR_MODELS_ROOT
                    value: /models
                resources:
                  limits:
                    nvidia.com/gpu: 1
                    cpu: '4'
                    memory: 48Gi
                  requests:
                    nvidia.com/gpu: 1
                    cpu: '2'
                    memory: 16Gi
                volumeMounts:
                  - name: src
                    mountPath: /app/config/model_registry.yaml
                    subPath: config/model_registry.yaml
                  - name: config
                    mountPath: /app/config/local.yaml
                    subPath: local.yaml
                  - name: models
                    mountPath: /models
                    readOnly: true
                  - name: src
                    mountPath: /app/services
                    subPath: services
                  - name: src
                    mountPath: /app/gateway
                    subPath: gateway
                  - name: src
                    mountPath: /app/registry
                    subPath: registry
                  - name: src
                    mountPath: /app/sdk
                    subPath: sdk
                  - name: src
                    mountPath: /app/serve_config.py
                    subPath: infra/k8s/serve_config.py
            volumes:
              - name: config
                configMap:
                  name: ray-config
              - name: models
                persistentVolumeClaim:
                  claimName: models-pvc
              - name: src
                hostPath:
                  path: /home/user/Documents/programs/ray
                  type: Directory
