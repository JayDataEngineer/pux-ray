# Tech Noir Forge — Flux CD root configuration
#
# Push to master → Flux syncs the cluster. Self-healing via health checks.
# If any resource becomes unhealthy, Flux re-reconciles within the interval.
#
# Layers (dependency order):
#   namespaces → infra-storage → infra-secrets → helm
#   → infra-services + git → ai-services + mcp → networking
#
# Setup (one-time):
#   sudo python -m infra.setup bootstrap --fix
#
# Verify:
#   flux get kustomizations
#   flux get kustomizations --watch

---
# GitRepository — Flux watches this repo on the master branch
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: tech-noir
  namespace: flux-system
spec:
  interval: 2m
  ref:
    branch: master
  url: https://github.com/JayDataEngineer/tech-noir-ray.git
  secretRef:
    name: github-token
  ignore: |
    # Exclude everything not related to Flux manifests
    /*
    !/infra/flux/

---
# Layer 1: Namespaces — must exist before anything else
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: namespaces
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  path: ./infra/flux/namespaces
  prune: true
  sourceRef:
    kind: GitRepository
    name: tech-noir
  timeout: 2m
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: ai-services
    - apiVersion: v1
      kind: Namespace
      name: infra
    - apiVersion: v1
      kind: Namespace
      name: mcp
    - apiVersion: v1
      kind: Namespace
      name: git
    - apiVersion: v1
      kind: Namespace
      name: ray-system

---
# Layer 2: Storage — PVs and PVCs (depends on namespaces)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-storage
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  path: ./infra/flux/infra-storage
  prune: true
  sourceRef:
    kind: GitRepository
    name: tech-noir
  dependsOn:
    - name: namespaces
  timeout: 2m
  healthChecks:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      name: models-pvc
      namespace: ai-services

---
# Layer 3: Secrets — SOPS-encrypted (depends on namespaces)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-secrets
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  path: ./infra/flux/infra-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: tech-noir
  dependsOn:
    - name: namespaces
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  timeout: 2m

---
# Layer 4: Helm — HelmRepositories + HelmReleases (depends on secrets + namespaces)
# Includes: Traefik, KubeRay operator, monitoring, Flux Operator
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: helm
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  path: ./infra/flux/helm
  prune: true
  sourceRef:
    kind: GitRepository
    name: tech-noir
  dependsOn:
    - name: namespaces
    - name: infra-storage
    - name: infra-secrets
  timeout: 5m
  healthChecks:
    # Traefik (DaemonSet — routes all traffic)
    - apiVersion: apps/v1
      kind: DaemonSet
      name: traefik
      namespace: kube-system
    # KubeRay operator (manages Ray clusters)
    - apiVersion: apps/v1
      kind: Deployment
      name: kuberay-operator
      namespace: ray-system
    # Forge Registry (image storage)
    - apiVersion: apps/v1
      kind: Deployment
      name: forge-registry
      namespace: infra

---
# Layer 5: Git services — Gitea + Act Runners (depends on helm for Gitea chart)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: git
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  path: ./infra/flux/git
  prune: true
  sourceRef:
    kind: GitRepository
    name: tech-noir
  dependsOn:
    - name: infra-storage
    - name: infra-secrets
    - name: helm
  timeout: 5m

---
# Layer 6: Infrastructure services (Postgres, Garage, monitoring, etc.)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-services
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  path: ./infra/flux/infra-services
  prune: true
  sourceRef:
    kind: GitRepository
    name: tech-noir
  dependsOn:
    - name: infra-storage
    - name: infra-secrets
    - name: helm
  timeout: 5m

---
# Layer 7: AI services — Ray cluster via KubeRay (depends on helm for KubeRay + secrets for HF_TOKEN)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ai-services
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  path: ./infra/flux/ai-services
  prune: true
  sourceRef:
    kind: GitRepository
    name: tech-noir
  dependsOn:
    - name: namespaces
    - name: infra-storage
    - name: infra-secrets
    - name: helm
  timeout: 5m

---
# Layer 7: MCP servers (depends on namespaces + storage + secrets)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mcp
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  path: ./infra/flux/mcp
  prune: true
  sourceRef:
    kind: GitRepository
    name: tech-noir
  dependsOn:
    - name: namespaces
    - name: infra-storage
    - name: infra-secrets
    - name: helm
  timeout: 5m

---
# Layer 8: Networking — Traefik IngressRoutes (depends on all services being up)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: networking
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  path: ./infra/flux/networking
  prune: true
  sourceRef:
    kind: GitRepository
    name: tech-noir
  dependsOn:
    - name: ai-services
    - name: mcp
  timeout: 3m

---
# Dev branch source — watches dev for dev-specific resources
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: tech-noir-dev
  namespace: flux-system
spec:
  interval: 5m
  ref:
    branch: dev
  url: https://github.com/JayDataEngineer/tech-noir-ray.git
  secretRef:
    name: github-token
  ignore: |
    /*
    !/infra/flux/dev/

---
# Dev resources — test jobs, debug configs, experimental manifests
# Add resources to infra/flux/dev/ on the dev branch. They auto-deploy.
# Promote to production: merge dev → master.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-resources
  namespace: flux-system
spec:
  interval: 5m
  path: ./infra/flux/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: tech-noir-dev
  dependsOn:
    - name: namespaces
