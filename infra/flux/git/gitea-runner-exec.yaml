# Act Runner — code executor
#
# Runs Gitea Actions jobs labeled `code-exec`. Used for tests, linting,
# and validation. No Docker socket — runs shell commands only.

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: act-runner-exec-config
  namespace: git
data:
  config.yaml: |
    runner:
      name: code-exec
      labels:
        - code-exec

    container:
      network: host

    cache:
      enabled: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: act-runner-exec
  namespace: git
  labels:
    app: act-runner-exec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: act-runner-exec
  template:
    metadata:
      labels:
        app: act-runner-exec
    spec:
      containers:
        - name: runner
          image: gitea/act_runner:0.2.12
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ ! -f /data/.runner ]; then
                act_runner register \
                  --instance "$GITEA_INSTANCE_URL" \
                  --token "$GITEA_RUNNER_REGISTRATION_TOKEN" \
                  --labels "$(grep -oP '(?<=labels:).*' /config/config.yaml | xargs)" \
                  --name "$(grep -oP '(?<=name:).*' /config/config.yaml | xargs)" \
                  --no-interactive
              fi
              exec act_runner daemon --config /config/config.yaml
          env:
            - name: GITEA_INSTANCE_URL
              value: http://gitea-http.git.svc.cluster.local:3000
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-runner-token
                  key: token
            - name: CONFIG_FILE
              value: /config/config.yaml
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: act-runner-exec-config
