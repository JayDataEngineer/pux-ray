data:
  tn-cost.json: |
    {
      "title": "Tech Noir Cost Analytics",
      "uid": "tn-cost",
      "version": 1,
      "tags": ["tech-noir", "cost"],
      "schemaVersion": 39,
      "timezone": "browser",
      "editable": true,
      "panels": [
        {
          "title": "Total GPU Cost (7d)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 0, "y": 0},
          "targets": [{
            "expr": "sum(increase(tn_gpu_seconds_total[7d])) * 0.3 / 3600",
            "legendFormat": "GPU Cost"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "color": {"mode": "fixed"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "red"}]}
            }
          }
        },
        {
          "title": "Total GPU Hours (7d)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 4, "y": 0},
          "targets": [{
            "expr": "sum(increase(tn_gpu_seconds_total[7d])) / 3600",
            "legendFormat": "GPU Hours"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "duration(h)",
              "decimals": 2
            }
          }
        },
        {
