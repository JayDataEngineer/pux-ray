apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-tn-business
  namespace: infra
  labels:
    grafana_dashboard: "1"
data:
  tn-business.json: |
    {
      "title": "Tech Noir Business",
      "uid": "tn-business",
      "version": 1,
      "tags": ["tech-noir", "business"],
      "schemaVersion": 39,
      "timezone": "browser",
      "editable": true,
      "panels": [
        {
          "title": "Revenue (24h)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 0, "y": 0},
          "targets": [{
            "expr": "sum(increase(tn_revenue_usd_total[24h]))",
            "legendFormat": "Revenue"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "color": {"mode": "fixed"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "green"}]}
            }
          }
        },
        {
          "title": "Margin (24h)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 4, "y": 0},
          "targets": [{
            "expr": "sum(increase(tn_margin_usd_total[24h]))",
            "legendFormat": "Margin"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "color": {"mode": "fixed"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "green"}]}
            }
          }
        },
        {
          "title": "Margin % (24h)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 8, "y": 0},
          "targets": [{
            "expr": "sum(increase(tn_margin_usd_total[24h])) / sum(increase(tn_revenue_usd_total[24h])) * 100",
            "legendFormat": "Margin %"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [
                {"value": null, "color": "red"},
                {"value": 30, "color": "yellow"},
                {"value": 60, "color": "green"}
              ]}
            }
          }
        },
        {
          "title": "Jobs Completed (24h)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 12, "y": 0},
          "targets": [{
            "expr": "sum(increase(tn_jobs_total{status=\"completed\"}[24h]))",
            "legendFormat": "Jobs"
          }]
        },
        {
          "title": "Credits Spent (24h)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 16, "y": 0},
          "targets": [{
            "expr": "sum(increase(tn_credits_spent_total[24h]))",
            "legendFormat": "Credits"
          }]
        },
        {
          "title": "Active Users (24h)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 20, "y": 0},
          "targets": [{
            "expr": "count(count by(user_id) (increase(tn_jobs_total[24h])))",
            "legendFormat": "Users"
          }]
        },
        {
          "title": "Revenue by Service",
          "type": "barchart",
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 4},
          "targets": [{
            "expr": "sum by(service_id) (increase(tn_revenue_usd_total[7d]))",
            "legendFormat": "{{service_id}}"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "color": {"mode": "palette-classic"}
            }
          }
        },
        {
          "title": "Margin by Service",
          "type": "barchart",
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 4},
          "targets": [{
            "expr": "sum by(service_id) (increase(tn_margin_usd_total[7d]))",
            "legendFormat": "{{service_id}}"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "color": {"mode": "palette-classic"}
            }
          }
        },
        {
          "title": "Job Status Breakdown",
          "type": "piechart",
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 4},
          "targets": [{
            "expr": "sum by(status) (increase(tn_jobs_total[30d]))",
            "legendFormat": "{{status}}"
          }]
        },
        {
          "title": "Revenue Trend (7d)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [{
            "expr": "sum by(service_id) (rate(tn_revenue_usd_total[1h]))",
            "legendFormat": "{{service_id}}"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "color": {"mode": "palette-classic"}
            }
          }
        },
        {
          "title": "GPU Seconds by Service (7d)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "targets": [{
            "expr": "sum by(service_id) (rate(tn_gpu_seconds_total[1h]))",
            "legendFormat": "{{service_id}}"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {"mode": "palette-classic"}
            }
          }
        }
      ]
    }

