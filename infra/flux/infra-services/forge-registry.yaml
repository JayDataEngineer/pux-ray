# Forge Registry — local container registry for tech-noir images
#
# Replaces the `docker save | k3s ctr images import` pipeline.
# Images are pushed here via Traefik (port 30500) and pulled by K3s
# containerd via K8s service DNS.
#
# Prerequisites:
#   - Traefik registry entrypoint configured (see traefik-config.yaml)
#   - K3s registries.yaml maps "forge-reg" to this service
#
# Usage:
#   docker push 100.86.69.57:30500/tech-noir/gpu-all:latest
#   # Pods reference: forge-reg.local:30500/tech-noir/gpu-all:latest

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forge-registry-pvc
  namespace: infra
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-registry
  namespace: infra
  labels:
    app: forge-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forge-registry
  template:
    metadata:
      labels:
        app: forge-registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
              name: registry
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - name: registry-storage
              mountPath: /var/lib/registry
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: registry-storage
          persistentVolumeClaim:
            claimName: forge-registry-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: forge-registry
  namespace: infra
spec:
  type: NodePort
  selector:
    app: forge-registry
  ports:
    - name: registry
      port: 5000
      targetPort: 5000
      nodePort: 30500
