# VictoriaMetrics single-node — Prometheus-compatible metrics storage
#
# Scrapes: node-exporter, kube-state-metrics, Ray, itself
# Port 8428 for ingestion and UI
# Internal DNS: victoriametrics.infra.svc.cluster.local:8428
#
# Storage: PVC on local-path (NVMe)

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vm-scrape-config
  namespace: infra
data:
  scrape.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # VictoriaMetrics self-monitoring
      - job_name: victoriametrics
        static_configs:
          - targets: ['localhost:8428']

      # Node exporter — one per node (hardware metrics)
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [infra]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: node-exporter

      # Kube state metrics — pod/deployment state
      - job_name: kube-state-metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [infra]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: kube-state-metrics

      # Ray dashboard metrics
      - job_name: ray
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [ai-services]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: tech-noir-ray-head-svc

      # vmalert — alert evaluation engine
      - job_name: vmalert
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [infra]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: vmalert

      # Postgres metrics (if pg_exporter is added later)
      # - job_name: postgres
      #   static_configs:
      #     - targets: ['postgres-exporter.infra.svc.cluster.local:9187']

      # Tech Noir webapp — business metrics (host machine)
      - job_name: tech-noir-webapp
        scrape_interval: 30s
        static_configs:
          - targets: ['192.168.1.117:8000']

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vm-data
  namespace: infra
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  namespace: infra
  labels:
    app: victoriametrics
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: victoriametrics
  template:
    metadata:
      labels:
        app: victoriametrics
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/monitoring
                    operator: In
                    values:
                      - "true"
      containers:
        - name: vm
          image: victoriametrics/victoria-metrics:latest
          args:
            - "-storageDataPath=/data"
            - "-retentionPeriod=30d"
            - "-promscrape.config=/etc/vm/scrape.yml"
            - "-promscrape.kubernetesSD=true"
            - "-selfScrapeInterval=15s"
            - "-httpListenAddr=:8428"
          ports:
            - containerPort: 8428
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
            requests:
              memory: 256Mi
              cpu: "250m"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/vm
          livenessProbe:
            httpGet:
              path: /health
              port: 8428
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8428
            initialDelaySeconds: 3
            periodSeconds: 5
      serviceAccountName: victoriametrics
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vm-data
        - name: config
          configMap:
            name: vm-scrape-config

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoriametrics
  namespace: infra

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: victoriametrics
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: victoriametrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: victoriametrics
subjects:
  - kind: ServiceAccount
    name: victoriametrics
    namespace: infra

---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: infra
spec:
  selector:
    app: victoriametrics
  ports:
    - port: 8428
      targetPort: 8428
