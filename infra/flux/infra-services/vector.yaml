# Vector — log + metrics collector (DaemonSet, one per node)
#
# Collects container logs from k3s → sends to Loki
# Lightweight Rust binary, ~50MB RAM per node
#
# When worker nodes join, they automatically get a Vector pod.

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: infra
data:
  vector.yaml: |
    sources:
      kubernetes_logs:
        type: kubernetes_logs

    transforms:
      parse_log:
        type: remap
        inputs: ["kubernetes_logs"]
        source: |
          .pod_name = .kubernetes.pod_name
          .namespace = .kubernetes.pod_namespace
          .container_name = .kubernetes.container_name

    sinks:
      loki:
        type: loki
        inputs: ["parse_log"]
        endpoint: "http://loki.infra.svc.cluster.local:3100"
        labels:
          source: "vector"
          namespace: "{{ namespace }}"
          pod: "{{ pod_name }}"
          container: "{{ container_name }}"
        encoding:
          codec: json
        buffer:
          type: memory
          max_events: 500

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: infra
  labels:
    app: vector
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      containers:
        - name: vector
          image: timberio/vector:0.44.0-debian
          args: ["--config", "/etc/vector/vector.yaml"]
          resources:
            limits:
              memory: 128Mi
              cpu: "200m"
            requests:
              memory: 64Mi
              cpu: "50m"
          volumeMounts:
            - name: config
              mountPath: /etc/vector
            - name: var-log
              mountPath: /var/log
              readOnly: true
            - name: var-lib
              mountPath: /var/lib
              readOnly: true
            - name: procfs
              mountPath: /host/proc
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: vector-config
        - name: var-log
          hostPath:
            path: /var/log
        - name: var-lib
          hostPath:
            path: /var/lib
        - name: procfs
          hostPath:
            path: /proc
