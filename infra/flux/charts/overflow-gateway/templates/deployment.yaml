apiVersion: apps/v1
kind: Deployment
metadata:
  name: overflow-gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: overflow-gateway
  template:
    metadata:
      labels:
        app: overflow-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ toJson .Values.command }}
          workingDir: {{ .Values.workingDir }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: LOCAL_RAY_URL
              value: {{ .Values.env.LOCAL_RAY_URL }}
            - name: LOCAL_TIMEOUT
              value: {{ .Values.env.LOCAL_TIMEOUT | quote }}
            {{- if .Values.env.CLOUD_SERVE_URL.secret }}
            - name: CLOUD_SERVE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.CLOUD_SERVE_URL.secret }}
                  key: {{ .Values.env.CLOUD_SERVE_URL.key }}
                  optional: true
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
