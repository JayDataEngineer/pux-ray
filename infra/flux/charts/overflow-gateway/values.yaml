image:
  repository: forge-registry.infra.svc.cluster.local:5000/tech-noir/overflow-gateway
  tag: "latest"
  pullPolicy: IfNotPresent

replicas: 1

command:
  - python
  - -m
  - uvicorn
  - main:create_app
  - --host
  - 0.0.0.0
  - --port
  - "8090"
  - --factory

workingDir: /app

service:
  port: 8090

env:
  LOCAL_RAY_URL: http://tech-noir-ray-serve-svc.ai-services.svc.cluster.local:8000
  LOCAL_TIMEOUT: "10"
  CLOUD_SERVE_URL:
    secret: shared-infra
    key: CLOUD_SERVE_URL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

probes:
  readiness:
    path: /health
    initialDelaySeconds: 3
    periodSeconds: 5
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 15

serviceMonitor:
  enabled: true
  interval: 15s
  labels:
    release: redshiftdb-infra
