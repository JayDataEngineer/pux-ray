# Cache PVCs for services that download their own models.
# Uses local-path provisioner (ships with k3s).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trellis-cache
  namespace: ai-services
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comfyui-cache
  namespace: ai-services
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
