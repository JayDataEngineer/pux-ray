<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; padding: 16px; background: #0a0a0a; color: #e5e5e5; }
  .field { margin-bottom: 12px; }
  label { display: block; font-size: 12px; color: #a3a3a3; margin-bottom: 4px; }
  select, input, textarea { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #333; background: #171717; color: #e5e5e5; font-size: 14px; }
  textarea { min-height: 60px; resize: vertical; }
  button { padding: 8px 20px; border-radius: 6px; border: none; background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .result { margin-top: 12px; display: none; }
  audio { width: 100%; margin-top: 8px; }
  .error { color: #ef4444; }
</style>
</head>
<body>
  <div class="field">
    <label>Engine</label>
    <select id="engine">
      <option value="">Loading engines...</option>
    </select>
  </div>
  <div class="field">
    <label>Text</label>
    <textarea id="text" placeholder="Enter text to speak..."></textarea>
  </div>
  <div class="field" id="voice-field" style="display:none">
    <label>Voice</label>
    <select id="voice"></select>
  </div>
  <div class="field" id="language-field" style="display:none">
    <label>Language</label>
    <select id="lang"></select>
  </div>
  <button onclick="doSpeak()">Speak</button>
  <div id="result" class="result"></div>
  <script>
  let engines = [];

  async function initEngines() {
    try {
      const resp = await window.__mcp.callTool('tts_voices', {});
      if (resp.error) throw new Error(resp.error);
      engines = resp.engines || [];
      const sel = document.getElementById('engine');
      sel.innerHTML = engines.map(e =>
        `<option value="${e.id}">${e.label}</option>`
      ).join('');
      if (engines.length) sel.selectedIndex = 0;
      sel.addEventListener('change', updateEngineUI);
      updateEngineUI();
    } catch(e) {
      document.getElementById('engine').innerHTML = '<option value="">Error: ' + e.message + '</option>';
    }
  }

  function updateEngineUI() {
    const engId = document.getElementById('engine').value;
    const eng = engines.find(e => e.id === engId);
    document.getElementById('voice-field').style.display = 'none';
    document.getElementById('language-field').style.display = 'none';

    if (!eng) return;
    const voiceParam = (eng.params || []).find(p => p.name === 'voice');
    if (voiceParam && voiceParam.options) {
      const voiceSel = document.getElementById('voice');
      const selVal = voiceSel.value;
      voiceSel.innerHTML = voiceParam.options.map(o =>
        `<option value="${o}"${o === (voiceParam.default || voiceParam.options[0]) ? ' selected' : ''}>${o.replace(/^[a-z]+_/, '')}</option>`
      ).join('');
      document.getElementById('voice-field').style.display = 'block';
    }
    const langParam = (eng.params || []).find(p => p.name === 'language');
    if (langParam && langParam.options) {
      const langSel = document.getElementById('lang');
      langSel.innerHTML = langParam.options.map(o =>
        `<option value="${o}"${o === (langParam.default || langParam.options[0]) ? ' selected' : ''}>${o}</option>`
      ).join('');
      document.getElementById('language-field').style.display = 'block';
    }
  }

  async function doSpeak() {
    const result = document.getElementById('result');
    result.style.display = 'block';
    result.innerHTML = 'Synthesizing...';
    try {
      const args = { text: document.getElementById('text').value, engine: document.getElementById('engine').value };
      const voiceSel = document.getElementById('voice');
      if (voiceSel && voiceSel.options.length) args.voice = voiceSel.value;
      const langSel = document.getElementById('lang');
      if (langSel && langSel.options.length) args.language = langSel.value;
      const resp = await window.__mcp.callTool('tts_speak', args);
      if (resp.error) throw new Error(resp.error);
      const audio = resp.audio_url || resp.url;
      if (audio) {
        result.innerHTML = '<audio controls src="' + audio + '"></audio>';
      } else {
        result.innerHTML = '<pre>' + JSON.stringify(resp, null, 2) + '</pre>';
      }
    } catch(e) {
      result.innerHTML = '<span style="color:#ef4444">' + e.message + '</span>';
    }
  }

  initEngines();
  </script>
</body>
</html>
