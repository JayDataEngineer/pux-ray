<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; padding: 16px; background: #0a0a0a; color: #e5e5e5; }
  .field { margin-bottom: 12px; }
  label { display: block; font-size: 12px; color: #a3a3a3; margin-bottom: 4px; }
  select, input, textarea { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #333; background: #171717; color: #e5e5e5; font-size: 14px; }
  textarea { min-height: 60px; resize: vertical; }
  button { padding: 8px 20px; border-radius: 6px; border: none; background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .result { margin-top: 12px; padding: 12px; border-radius: 6px; background: #171717; border: 1px solid #333; display: none; }
  .result img, .result video { max-width: 100%; border-radius: 6px; }
  .error { color: #ef4444; }
  .service-info { font-size: 11px; color: #666; margin-top: 2px; }
</style>
</head>
<body>
  <div class="field">
    <label>Service</label>
    <select id="model">
      <option value="">Loading services...</option>
    </select>
    <div class="service-info" id="service-info"></div>
  </div>
  <div class="field">
    <label>Prompt</label>
    <textarea id="prompt" placeholder="Describe what you want to generate..."></textarea>
  </div>
  <div class="field">
    <label>Seed (optional)</label>
    <input type="number" id="seed" placeholder="Random">
  </div>
  <button id="generate" onclick="doGenerate()">Generate</button>
  <div id="result" class="result"></div>
  <script>
  let allServices = [];
  const CATEGORY_PRIORITY = { 'image': 1, 'video': 2, '3d': 3, 'audio': 4, 'tts': 5, 'llm': 6, 'creative': 7, 'motion': 8, 'asr': 9, 'training': 99 };

  async function initServices() {
    const sel = document.getElementById('model');
    try {
      const resp = await window.__mcp.callTool('list_services', {});
      if (resp.error) throw new Error(resp.error);
      allServices = (resp.services || []).filter(s => !['asr','llm','training'].includes(s.category));
      allServices.sort((a, b) => {
        const ca = CATEGORY_PRIORITY[a.category] || 99;
        const cb = CATEGORY_PRIORITY[b.category] || 99;
        if (ca !== cb) return ca - cb;
        return (a.label || a.name).localeCompare(b.label || b.name);
      });
      sel.innerHTML = allServices.map(s =>
        `<option value="${s.name}">${s.label} (${s.category})${s.needs_gpu ? ' [GPU]' : ' [CPU]'}</option>`
      ).join('');
      if (allServices.length) {
        sel.value = allServices[0].name;
        updateServiceInfo();
      }
    } catch(e) {
      sel.innerHTML = '<option value="">Failed to load: ' + e.message + '</option>';
    }
    sel.addEventListener('change', updateServiceInfo);
  }

  function updateServiceInfo() {
    const sel = document.getElementById('model');
    const info = document.getElementById('service-info');
    const svc = allServices.find(s => s.name === sel.value);
    info.textContent = svc ? (svc.description || svc.category) : '';
  }

  async function doGenerate() {
    const btn = document.getElementById('generate');
    const result = document.getElementById('result');
    btn.disabled = true;
    btn.textContent = 'Generating...';
    result.style.display = 'block';
    result.className = 'result';
    result.innerHTML = 'Loading...';
    try {
      const args = { service: document.getElementById('model').value, params: { prompt: document.getElementById('prompt').value } };
      const seed = document.getElementById('seed').value;
      if (seed) args.params.seed = parseInt(seed);
      const resp = await window.__mcp.callTool('run', args);
      if (resp.error) throw new Error(resp.error);
      const output = resp.result || resp.outputs || resp;
      if (output.video_url) {
        result.innerHTML = '<video controls src="' + output.video_url + '"></video>';
      } else if (output.image_url || output.url) {
        result.innerHTML = '<img src="' + (output.image_url || output.url) + '" alt="Generated">';
      } else if (output.mesh_url) {
        result.innerHTML = '<a href="' + output.mesh_url + '" download>Download 3D Mesh (GLB)</a>';
      } else if (output.data && output.media_type && output.media_type.startsWith('image')) {
        result.innerHTML = '<img src="data:' + output.media_type + ';base64,' + output.data + '" alt="Generated">';
      } else if (output.data && output.media_type && output.media_type.startsWith('audio')) {
        result.innerHTML = '<audio controls src="data:' + output.media_type + ';base64,' + output.data + '"></audio>';
      } else {
        result.innerHTML = '<pre>' + JSON.stringify(output, null, 2) + '</pre>';
      }
    } catch(e) {
      result.className = 'result error';
      result.textContent = e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Generate';
    }
  }

  initServices();
  </script>
</body>
</html>
