[project]
name = "wan2gp-studio-mcp"
version = "0.1.0"
description = "MCP server wrapping the Forge GPU inference gateway (wan2gp)"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=0.1.0",
    "httpx>=0.27",
    "loguru>=0.7",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
