[project]
name = "media-analysis-mcp"
version = "0.2.0"
description = "MCP server for media analysis: vision, audio, video — CPU and GPU modes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Core
    "fastmcp>=0.1.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "httpx>=0.27.0",

    # Vision (Florence-2, Grounding DINO, Phi-4, Kosmos-2.5)
    "transformers==4.45.2",
    "einops>=0.8.0",
    "timm>=1.0.0",
    "pillow>=10.0.0",

    # Router (FunctionGemma GGUF)
    "llama-cpp-python>=0.3.0",

    # Object Detection (YOLOv8)
    "ultralytics>=8.3.0",

    # ASR (Parakeet TDT v3)
    "onnx-asr[cpu,hub]>=0.11.0",

    # Shared ONNX runtime (WD14 tagger, YOLOv8, NudeNet, InsightFace, PANNs)
    "onnxruntime>=1.20.0",

    # Video processing
    "numpy>=1.26.0",

    # Model downloads
    "huggingface-hub>=0.20.0",

    # Image Color (ColorThief)
    "colorthief>=0.2.1",

    # Barcode / QR detection
    "pyzbar>=0.1.9",

    # Scene detection
    "scenedetect[opencv]>=0.6.4",

    # Audio fingerprinting
    "pyacoustid>=1.3.0",

    # Audio classification (PANNs mel spectrogram)
    "librosa>=0.10.0",
    "soundfile>=0.12.0",

    # Face detection (InsightFace)
    "insightface>=0.7.3",

    # Image segmentation (SAM 2)
    "sam2>=0.4.0",

    # Speaker diarization (Pyannote 3.1)
    "pyannote.audio>=3.1.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
