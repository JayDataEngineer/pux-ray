name: Renovate

on:
  schedule:
    - cron: '0 3 * * 6'  # Saturday 3am ET
  workflow_dispatch:

jobs:
  renovate:
    runs-on: code-exec
    steps:
      - uses: actions/checkout@v4
      - name: Run Renovate
        run: |
          docker run --rm \
            -e RENOVATE_TOKEN=${{ secrets.RENOVATE_TOKEN }} \
            -e LOG_LEVEL=info \
            -v $(pwd)/renovate.json:/opt/renovate/config.json \
            renovate/renovate:latest
