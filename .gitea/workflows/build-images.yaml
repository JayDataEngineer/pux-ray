name: Build Images

on:
  push:
    branches: [master]
    paths:
      - 'infra/docker/**'
      - 'services/**'
      - 'gateway/**'
      - 'registry/**'
      - 'sdk/**'
      - 'vendor/**'
      - 'mcp/**'
      - 'infra/flux/mcp/**'
      - 'pyproject.toml'

concurrency:
  group: build-${{ gitea.ref }}
  cancel-in-progress: true

env:
  REGISTRY: 100.86.69.57:30500/tech-noir

jobs:
  build-base:
    runs-on: docker-builder
    if: |
      contains(github.event.commits.*.modified, 'infra/docker/Dockerfile.base') ||
      contains(github.event.commits.*.added, 'infra/docker/Dockerfile.base')
    steps:
      - uses: actions/checkout@v4
      - name: Build ray-base
        run: |
          docker build -f infra/docker/Dockerfile.base \
            -t ${REGISTRY}/ray-base:latest .
      - name: Push ray-base
        run: docker push ${REGISTRY}/ray-base:latest

  build-gpu-all:
    needs: [build-base]
    runs-on: docker-builder
    if: always() && (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - name: Build gpu-all
        run: |
          docker build -f infra/docker/Dockerfile.gpu-all \
            -t ${REGISTRY}/gpu-all:latest \
            -t ${REGISTRY}/gpu-all:${{ github.sha }} .
      - name: Push gpu-all
        run: |
          docker push ${REGISTRY}/gpu-all:latest
          docker push ${REGISTRY}/gpu-all:${{ github.sha }}

  build-model-sync:
    runs-on: docker-builder
    steps:
      - uses: actions/checkout@v4
      - name: Build model-sync
        run: |
          docker build -f infra/docker/Dockerfile.model-sync \
            -t ${REGISTRY}/model-sync:latest .
      - name: Push model-sync
        run: docker push ${REGISTRY}/model-sync:latest

  build-mcp:
    runs-on: docker-builder
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: mcp/media-analysis/Dockerfile
            tag: mcp-media-analysis
            context: mcp/media-analysis
          - dockerfile: mcp/web-research/Dockerfile
            tag: mcp-web-research
            context: mcp/web-research
          - dockerfile: vendor/equibles/src/Equibles.Mcp.Server/Dockerfile
            tag: mcp-equibles
            context: vendor/equibles
          - dockerfile: vendor/equibles/src/Equibles.Worker.Host/Dockerfile
            tag: mcp-equibles-worker
            context: vendor/equibles
          - dockerfile: vendor/equibles/src/Equibles.Web/Dockerfile
            tag: mcp-equibles-web
            context: vendor/equibles
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build ${{ matrix.tag }}
        run: |
          docker build -f ${{ matrix.dockerfile }} \
            -t ${REGISTRY}/${{ matrix.tag }}:latest \
            ${{ matrix.context }}
      - name: Push ${{ matrix.tag }}
        run: docker push ${REGISTRY}/${{ matrix.tag }}:latest

  deploy:
    needs: [build-gpu-all, build-model-sync, build-mcp]
    runs-on: code-exec
    if: always() && (needs.build-gpu-all.result == 'success' || needs.build-model-sync.result == 'success' || needs.build-mcp.result == 'success')
    steps:
      - name: Save current image as rollback target
        if: needs.build-gpu-all.result == 'success'
        run: |
          CURRENT=$(kubectl get pod -n ai-services -l app.kubernetes.io/name=tech-noir-ray-head \
            -o jsonpath='{.items[0].spec.containers[0].image}' 2>/dev/null || echo "")
          if [ -n "$CURRENT" ]; then
            docker pull "$CURRENT" 2>/dev/null || true
            docker tag "$CURRENT" ${REGISTRY}/gpu-all:stable 2>/dev/null || true
            docker push ${REGISTRY}/gpu-all:stable 2>/dev/null || true
            echo "Rollback target saved: $CURRENT"
          fi

      - name: Restart Ray head pod
        if: needs.build-gpu-all.result == 'success'
        run: |
          kubectl delete pod -n ai-services -l app.kubernetes.io/name=tech-noir-ray-head

      - name: Wait for head pod readiness
        if: needs.build-gpu-all.result == 'success'
        run: |
          echo "Waiting 90s for head pod to start..."
          sleep 90
          for i in $(seq 1 12); do
            READY=$(kubectl get pod -n ai-services -l app.kubernetes.io/name=tech-noir-ray-head \
              -o jsonpath='{.items[0].status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
            if [ "$READY" = "true" ]; then
              echo "Head pod is ready."
              exit 0
            fi
            echo "Not ready yet, waiting 10s... (attempt $i/12)"
            sleep 10
          done
          echo "ERROR: Head pod did not become ready in time"
          exit 1

      - name: Restart MCP deployments
        if: needs.build-mcp.result == 'success'
        run: |
          kubectl rollout restart deployment -n mcp -l app.kubernetes.io/part-of=mcp
          echo "MCP deployments restarted"

      - name: Health check
        run: |
          for i in $(seq 1 6); do
            if curl -sf http://tech-noir-ray-serve-svc.ai-services.svc.cluster.local:8000/health > /dev/null 2>&1; then
              echo "Health check passed."
              exit 0
            fi
            echo "Health check failed, retrying in 10s... (attempt $i/6)"
            sleep 10
          done
          echo "ERROR: Health check failed after deploy"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Rolling back to stable image..."
          kubectl patch rayservice tech-noir-ray -n ai-services --type merge -p \
            '{"spec":{"rayClusterConfig":{"headGroupSpec":{"template":{"spec":{"containers":[{"name":"ray-head","image":"'${REGISTRY}/gpu-all:stable'"}]}}}}}}'
          kubectl delete pod -n ai-services -l app.kubernetes.io/name=tech-noir-ray-head
          echo "Rollback initiated. Check status manually."
