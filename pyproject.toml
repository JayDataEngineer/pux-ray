[project]
name = "tech-noir-ray"
version = "0.1.0"
description = "Ray-based AI infrastructure for Tech Noir"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Core framework — boot system, ingress gateway, CLI
    "ray[serve]>=2.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "starlette>=0.37",
    "python-multipart>=0.0.7",
    "uvicorn>=0.30",
    "rich>=13.0",
    "prometheus-client>=0.18",
    # Model download CLI (lightweight, used by ray-noir models pull)
    "huggingface-hub>=0.24",
    "modelscope>=1.20",
    # Database — PostgreSQL with Apache AGE (graph) extension
    "psycopg[binary,pool]>=3.2",
    # Image handling (used across workflows, anny/PIL need it but don't declare it)
    "Pillow>=10.0",
    "opencv-python-headless>=4.9",                    # DWPose ONNX preprocessing
    "onnxruntime>=1.18",                              # DWPose YOLOX + RTMPose inference
    # 3D body mesh rendering for BodyMeshRenderer (lazy import in body_mesh.py)
    "anny>=0.3.1",
    # Heavy AI service deps (kokoro, transformers, torchaudio, diffusers, spconv,
    # pytorch3d, nvdiffrast, flash_attn, etc.) live in the golden Docker image
    # (infra/docker/Dockerfile.gpu-all). Service-specific extras (rembg[cpu],
    # utils3d CUDA, mmgp) live in per-service Dockerfiles extending gpu-all.
    "websockets>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.5",
    "pytest-cov>=6.0",
]

[project.scripts]
ray-noir = "registry.cli:main"
tech-noir = "boot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services", "gateway", "registry", "sdk", "scripts", "boot", "vendor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "unit: fast tests, no GPU/network needed",
    "integration: tests requiring live Ray cluster",
    "gpu: needs CUDA GPU with drivers",
    "slow: takes >5 seconds",
    "handler: tests a specific family_handler",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
