[project]
name = "tech-noir-ray"
version = "0.1.0"
description = "Ray-based AI infrastructure for Tech Noir"
requires-python = ">=3.11"
dependencies = [
    "ray[serve]>=2.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "starlette>=0.37",
    "python-multipart>=0.0.7",
    "uvicorn>=0.30",
    "huggingface-hub>=0.24",
    "rich>=13.0",
    # CPU TTS/ASR services (in-process imports)
    "kokoro>=0.4",
    "soundfile>=0.12",
    "numpy>=1.26",
    "faster-whisper>=1.0",
    "phonemizer>=3.0",
    "misaki[en]>=0.7",
    # GPU services (torch already installed with CUDA)
    "torchaudio>=2.1",
    "transformers>=4.40",
    "accelerate>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ray-noir = "registry.cli:main"
tech-noir = "boot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services", "gateway", "registry", "sdk", "scripts", "boot"]
