<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; padding: 16px; background: #0a0a0a; color: #e5e5e5; }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
  .tab { padding: 6px 12px; border-radius: 6px 6px 0 0; background: #171717; border: 1px solid #333; cursor: pointer; font-size: 13px; color: #a3a3a3; }
  .tab.active { background: #262626; color: #e5e5e5; border-bottom-color: transparent; }
  .panel { display: none; }
  .panel.active { display: block; }
  .field { margin-bottom: 12px; }
  label { display: block; font-size: 12px; color: #a3a3a3; margin-bottom: 4px; }
  textarea { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #333; background: #171717; color: #e5e5e5; font-size: 14px; min-height: 60px; resize: vertical; }
  button { padding: 8px 20px; border-radius: 6px; border: none; background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .result { margin-top: 12px; display: none; }
  audio { width: 100%; margin-top: 8px; }
</style>
</head>
<body>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('transcribe')">Transcribe</div>
    <div class="tab" onclick="switchTab('sound')">Sound Effect</div>
    <div class="tab" onclick="switchTab('music')">Music</div>
  </div>
  <div id="transcribe" class="panel active">
    <div class="field"><label>Audio URL or base64</label><textarea id="audio_input" placeholder="Paste audio URL or base64..."></textarea></div>
    <button onclick="doTranscribe()">Transcribe</button>
  </div>
  <div id="sound" class="panel">
    <div class="field"><label>Sound Description</label><textarea id="sound_desc" placeholder="Describe the sound effect..."></textarea></div>
    <button onclick="doSound()">Generate Sound</button>
  </div>
  <div id="music" class="panel">
    <div class="field"><label>Music Description</label><textarea id="music_desc" placeholder="Describe the music..."></textarea></div>
    <button onclick="doMusic()">Generate Music</button>
  </div>
  <div id="result" class="result"></div>
  <script>
  function switchTab(id) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(id).classList.add('active');
  }
  async function doTranscribe() {
    showResult('Transcribing...');
    try {
      const r = await window.__mcp.callTool('transcribe', { audio_b64: document.getElementById('audio_input').value });
      showResult(r.text || r.transcription || JSON.stringify(r));
    } catch(e) { showResult(e.message, true); }
  }
  async function doSound() {
    showResult('Generating sound...');
    try {
      const r = await window.__mcp.callTool('generate_sound', { text: document.getElementById('sound_desc').value });
      showResult(r.audio_url ? '<audio controls src="' + r.audio_url + '"></audio>' : JSON.stringify(r));
    } catch(e) { showResult(e.message, true); }
  }
  async function doMusic() {
    showResult('Generating music...');
    try {
      const r = await window.__mcp.callTool('generate_music', { text: document.getElementById('music_desc').value });
      showResult(r.audio_url ? '<audio controls src="' + r.audio_url + '"></audio>' : JSON.stringify(r));
    } catch(e) { showResult(e.message, true); }
  }
  function showResult(html, isError) {
    const el = document.getElementById('result');
    el.style.display = 'block';
    el.innerHTML = isError ? '<span style="color:#ef4444">' + html + '</span>' : html;
  }
  </script>
</body>
</html>
