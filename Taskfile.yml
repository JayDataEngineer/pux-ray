# Tech Noir Ray — Task Runner
# ============================================
# Professional task runner for AI infrastructure setup and operations.
#
# Install Task:  sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b ~/.local/bin
# Quick start:   task setup
# Daily use:     task boot          (starts everything)
#                task status        (show all services)
#
# Service lifecycle is managed by the boot/ Python package.
# See: boot/cli.py, boot/services.py, AGENTS.md

version: '3'

vars:
  VENV_PYTHON: .venv/bin/python
  RAY_BIN: .venv/bin/ray

tasks:
  # ── Boot (main entry point) ──────────────────────────────────────────────
  boot:
    desc: "Verify k3s + Flux health, start Docker services"
    cmds:
      - "{{.VENV_PYTHON}} -m boot.cli boot"

  boot:docker:
    desc: "Start all Docker Compose services only"
    cmds:
      - "{{.VENV_PYTHON}} -m boot.cli boot docker"

  heal:
    desc: "Force-reconcile all Flux Kustomizations"
    cmds:
      - "{{.VENV_PYTHON}} -m boot.cli heal"

  # ── Service lifecycle ────────────────────────────────────────────────────
  build:
    desc: "Build Ray images (gpu-all + wan2gp) via docker bake and push to Forge Registry"
    cmds:
      - docker bake gpu-all wan2gp --push

  build:wan2gp:
    desc: "Build Wan2GP image (separate from gpu-all)"
    cmds:
      - docker bake wan2gp --push

  deploy:
    desc: "Force Ray pods to pick up new image (delete head pod, wait for ready)"
    cmds:
      - kubectl delete pod -n ai-services -l app.kubernetes.io/name=tech-noir-ray-head
      - kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=tech-noir-ray-head -n ai-services --timeout=300s

  release:
    desc: "Build + deploy in one shot (docker bake + push + pod restart)"
    cmds:
      - task: build
      - task: deploy

  up:
    desc: "Start specific service (e.g. task up ray-cluster)"
    cmds:
      - "{{.VENV_PYTHON}} -m boot.cli up {{.CLI_ARGS}}"

  down:
    desc: "Stop all services"
    cmds:
      - "{{.VENV_PYTHON}} -m boot.cli stop"

  stop:
    desc: "Stop specific service (e.g. task stop redshiftdb)"
    cmds:
      - "{{.VENV_PYTHON}} -m boot.cli stop {{.CLI_ARGS}}"

  status:
    desc: "Show all service status"
    cmds:
      - "{{.VENV_PYTHON}} -m boot.cli status"

  # ── Setup ────────────────────────────────────────────────────────────────
  setup:
    desc: "Full bootstrap (first run on new machine)"
    cmds:
      - task: setup:prereqs
      - task: setup:host
      - task: setup:config
      - task: setup:venv
      - task: setup:repos
      - task: setup:tools
      - task: models:status

  setup:prereqs:
    desc: "Check prerequisites (Python, uv, CUDA, Docker)"
    internal: true
    cmds:
      - python3 --version
      - uv --version
      - "nvidia-smi --query-gpu=name --format=csv,noheader || echo 'WARNING: No GPU detected'"
      - "docker --version || echo 'WARNING: Docker not found (needed for repo sync)'"

  setup:host:
    desc: "Bootstrap host for k3s + Flux (one-time, idempotent)"
    cmds:
      - sudo python -m infra.setup bootstrap --fix

  setup:config:
    desc: "Copy config template if local.yaml doesn't exist"
    status:
      - test -f config/local.yaml
    cmds:
      - cp config/local.yaml.example config/local.yaml
      - |
        echo ""
        echo ">>> config/local.yaml created from template."
        echo ">>> Set these env vars or edit config/local.yaml:"
        echo "    TECH_NOIR_MODELS_ROOT   - Where models are stored"
        echo "    TECH_NOIR_COMFYUI_DIR   - ComfyUI installation path"
        echo "    TECH_NOIR_COMFYUI_PYTHON - ComfyUI venv Python"
        echo ""

  setup:venv:
    desc: "Create main Python venv and install dependencies"
    sources:
      - pyproject.toml
      - uv.lock
    generates:
      - .venv/bin/python
    cmds:
      - uv sync

  setup:repos:
    desc: "Clone creative tool repos + llama.cpp"
    cmds:
      - "{{.VENV_PYTHON}} -m infra.setup.clone"

  setup:tools:
    desc: "Build llama.cpp + create bare-metal tool venvs + build Docker workers"
    deps: [setup:repos]
    cmds:
      - "{{.VENV_PYTHON}} -m infra.setup all"

  # ── Models ───────────────────────────────────────────────────────────────
  models:list:
    desc: "List all models and download status"
    cmds:
      - "{{.VENV_PYTHON}} -m registry.cli models list"

  models:pull:
    desc: "Download missing models from HuggingFace (pass model name as arg)"
    cmds:
      - "{{.VENV_PYTHON}} -m registry.cli models pull {{.CLI_ARGS}}"

  models:download:
    desc: "Download ALL models needed by the system (registry + Wan2GP + Lance AWQ + Kimodo + avatar)"
    cmds:
      - 'echo "=== Phase 1: Registry models (TTS, ASR, 3D, audio, ComfyUI, vision, etc.) ==="'
      - "{{.VENV_PYTHON}} -m registry.cli models pull"
      - echo ""
      - 'echo "=== Phase 2: Wan2GP models (183 defaults, via K8s Job on PVC) ==="'
      - |
        echo "Launching Wan2GP model download Job ..."
        kubectl delete job wan2gp-model-download -n ai-services --ignore-not-found
        kubectl apply -f infra/k8s/wan2gp-download-job.yaml
        echo "Job started. Watching progress (this takes a while)..."
        kubectl logs -n ai-services -l app=wan2gp-download -f 2>/dev/null || echo "  (pod starting... run 'kubectl logs -n ai-services -l app=wan2gp-download -f' to watch)"
      - echo ""
      - echo "=== Done ==="
      - echo "Run 'task models:status' to check disk usage."

  models:download:wan2gp:
    desc: "Download ALL Wan2GP default models via K8s Job (writes to PVC)"
    cmds:
      - |
        kubectl delete job wan2gp-model-download -n ai-services --ignore-not-found
        kubectl apply -f infra/k8s/wan2gp-download-job.yaml
        echo "Job started. Watch progress:"
        echo "  kubectl logs -n ai-services -l app=wan2gp-download -f"
        echo "  kubectl wait --for=condition=complete job/wan2gp-model-download -n ai-services --timeout=86400s"

  models:verify:
    desc: "Verify all models exist and have correct size"
    cmds:
      - "{{.VENV_PYTHON}} -m registry.cli models verify"

  models:status:
    desc: "Show model disk usage summary"
    cmds:
      - "{{.VENV_PYTHON}} -m registry.cli models status"

  # ── Shared Infrastructure ────────────────────────────────────────────────
  infra:build:
    desc: "Build Postgres AGE+pgvector image and push to Forge Registry"
    sources:
      - infra/docker/Dockerfile.postgres-age
    generates:
      - /dev/null
    cmds:
      - docker build -f infra/docker/Dockerfile.postgres-age -t 100.86.69.57:30500/tech-noir/postgres-age-vector:latest .
      - docker push 100.86.69.57:30500/tech-noir/postgres-age-vector:latest

  infra:deploy:
    desc: "Deploy shared infra via Flux reconciliation"
    cmds:
      - flux reconcile kustomization namespaces --with-source
      - flux reconcile kustomization infra-storage --with-source
      - flux reconcile kustomization infra-secrets --with-source
      - flux reconcile kustomization infra-services --with-source
      - echo "Waiting for Postgres..."
      - kubectl wait --for=condition=ready pod -l app=postgres -n infra --timeout=120s
      - echo "Waiting for Garage..."
      - kubectl wait --for=condition=ready pod -l app=garage -n infra --timeout=60s

  infra:status:
    desc: "Show Flux sync status + pod state"
    cmds:
      - flux get kustomizations
      - kubectl get pods,svc,pvc -n infra

  infra:down:
    desc: "Tear down shared infra (keeps PVCs)"
    cmds:
      - kubectl delete -f infra/k8s/shared/ --ignore-not-found

  infra:pg:
    desc: "Open psql shell to shared Postgres"
    cmds:
      - kubectl exec -n infra -it postgres-0 -- psql -U postgres

  infra:s3:
    desc: "Configure Garage S3 (list buckets)"
    cmds:
      - kubectl exec -n infra -it deploy/garage -- garage bucket list

  # ── Monitoring ─────────────────────────────────────────────────────────
  infra:monitor:
    desc: "Deploy monitoring stack via Flux reconciliation"
    cmds:
      - flux reconcile kustomization infra-services --with-source
      - echo "Waiting for monitoring stack..."
      - kubectl wait --for=condition=ready pod -l app=victoriametrics -n infra --timeout=60s
      - kubectl wait --for=condition=ready pod -l app=grafana -n infra --timeout=60s
      - kubectl wait --for=condition=ready pod -l app=loki -n infra --timeout=60s
      - echo ""
      - "echo 'Grafana: http://100.86.69.57:30080/grafana'"
      - echo ""
      - "echo 'Dashboards pre-loaded: Node Exporter, K8s Cluster, Pod Resources, Ray, PostgreSQL'"

  infra:monitor:status:
    desc: "Show monitoring stack status"
    cmds:
      - echo "=== Monitoring pods ===" && kubectl get pods -n infra -l 'app in (victoriametrics,grafana,loki,node-exporter,kube-state-metrics,vector)'
      - echo "=== Scrape targets ===" && kubectl exec -n infra deploy/victoriametrics -- wget -qO- http://localhost:8428/targets 2>/dev/null | head -5 || echo "Check VM UI for targets"

  # ── Secrets Management ──────────────────────────────────────────────────
  secrets:edit:
    desc: "Open secrets.env in $EDITOR"
    cmds:
      - ${EDITOR:-nano} config/secrets.env

  secrets:sops:
    desc: "Generate AGE key, encrypt secrets with SOPS, commit for Flux"
    cmds:
      - "{{.VENV_PYTHON}} -m infra.setup sops --fix"
      - git add infra/flux/infra-secrets/ .sops.yaml
      - |
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update encrypted secrets (SOPS)"
          git push
        fi

  secrets:sync:
    desc: "Push secrets directly to k8s (imperative, quick updates)"
    cmds:
      - "{{.VENV_PYTHON}} infra/secrets_sync.py"

  secrets:list:
    desc: "List secrets in all namespaces"
    cmds:
      - kubectl get secrets -n infra
      - kubectl get secrets -n mcp
      - kubectl get secrets -n ai-services

  # ── Cluster Bootstrap ──────────────────────────────────────────────────
  k3s:install:
    desc: "Install k3s on this machine"
    cmds:
      - curl -sfL https://get.k3s.io | sh
      - sleep 10
      - kubectl wait --for=condition=Ready node --all --timeout=60s

  # ── Flux CD ─────────────────────────────────────────────────────────────
  flux:install:
    desc: "Install Flux controllers (source + kustomize + helm)"
    cmds:
      - flux install --components=source-controller,kustomize-controller,helm-controller,notification-controller

  flux:check:
    desc: "Check Flux installation health"
    cmds:
      - flux check

  flux:bootstrap:
    desc: "Apply root Flux config and start reconciliation"
    cmds:
      - kubectl apply -f infra/flux/clusters/forge/kustomization.yaml
      - flux get kustomizations --watch

  flux:reconcile:
    desc: "Force reconcile all Flux layers in dependency order"
    cmds:
      - flux reconcile kustomization namespaces --with-source
      - flux reconcile kustomization infra-storage --with-source
      - flux reconcile kustomization infra-secrets --with-source
      - flux reconcile kustomization helm --with-source
      - flux reconcile kustomization git --with-source
      - flux reconcile kustomization infra-services --with-source
      - flux reconcile kustomization ai-services --with-source
      - flux reconcile kustomization mcp --with-source
      - flux reconcile kustomization networking --with-source

  flux:status:
    desc: "Show Flux sync status for all layers"
    cmds:
      - flux get kustomizations
      - flux get sources git

  flux:suspend:
    desc: "Suspend all Flux reconciliations (for maintenance)"
    cmds:
      - flux suspend kustomization namespaces infra-storage infra-secrets git infra-services ai-services mcp networking

  flux:resume:
    desc: "Resume all Flux reconciliations"
    cmds:
      - flux resume kustomization namespaces infra-storage infra-secrets git infra-services ai-services mcp networking

  flux:ui:
    desc: "Show Capacitor URL for visual Flux dashboard"
    cmds:
      - 'echo "Capacitor: http://100.86.69.57:30080/flux"'

  # ── Hooks ──────────────────────────────────────────────────────────────────
  hooks:install:
    desc: "Install pre-commit hooks (kubeconform, yamllint, detect-secrets)"
    cmds:
      - command -v pre-commit >/dev/null 2>&1 || pip install pre-commit
      - pre-commit install
      - 'echo "Hooks installed. Run: pre-commit run --all-files"'

  hooks:run:
    desc: "Run all pre-commit hooks against the repo"
    cmds:
      - pre-commit run --all-files

  # ── Flux OCI Sync (local IaC fallback — no GitHub needed) ─────────────────
  flux:sync:
    desc: "Push infra/flux/ as OCI artifact to forge-registry + reconcile Flux"
    cmds:
      - "{{.VENV_PYTHON}} -m infra.flux_sync push"

  flux:sync:watch:
    desc: "Watch infra/flux/ dir and sync on every change (blocks)"
    cmds:
      - "{{.VENV_PYTHON}} -m infra.flux_sync watch"

  flux:sync:status:
    desc: "Show flux-sync systemd watcher status"
    cmds:
      - systemctl status flux-sync.path flux-sync.timer --no-pager -l
      - echo "---"
      - journalctl -u flux-sync.service --no-pager -n 10

  # ── Renovate ───────────────────────────────────────────────────────────────
  renovate:run:
    desc: "Run Renovate dependency check manually (reads token from k8s secret)"
    cmds:
      - |
        RENOVATE_TOKEN=$(kubectl get secret shared-infra -n git \
          -o jsonpath='{.data.RENOVATE_TOKEN}' 2>/dev/null | base64 -d)
        if [ -z "$RENOVATE_TOKEN" ]; then
          echo "ERROR: RENOVATE_TOKEN not set. Add to config/secrets.env and run: task secrets:sync"
          exit 1
        fi
        docker run --rm \
          -e RENOVATE_TOKEN=$RENOVATE_TOKEN \
          -v $(pwd)/renovate.json:/opt/renovate/config.json \
          renovate/renovate:latest

  # ── Gitea ────────────────────────────────────────────────────────────────
  gitea:setup:
    desc: "Deploy Gitea + runners via Flux reconciliation"
    cmds:
      - flux reconcile kustomization git --with-source
      - 'echo "Waiting for Gitea pod..."'
      - kubectl wait --for=condition=ready pod -l app=gitea -n git --timeout=120s
      - 'echo "Waiting for setup Job to complete..."'
      - kubectl wait --for=condition=complete job/gitea-setup -n git --timeout=180s
      - 'echo "Waiting for runners..."'
      - kubectl wait --for=condition=ready pod -l app=act-runner-builder -n git --timeout=120s
      - kubectl wait --for=condition=ready pod -l app=act-runner-exec -n git --timeout=120s
      - 'echo ""'
      - 'echo "Gitea: http://100.86.69.57:30080/git/"'
      - 'echo "SSH:   git@100.86.69.57:30222"'
      - 'echo "Flux:  now watching Gitea (internal cluster DNS)"'

  gitea:status:
    desc: "Show Gitea + runner pod status"
    cmds:
      - kubectl get pods,svc,pvc -n git

  # ── Testing ──────────────────────────────────────────────────────────────
  test:
    desc: "Run pytest test suite"
    cmds:
      - "{{.VENV_PYTHON}} -m pytest tests/ -v {{.CLI_ARGS}}"

  validate:
    desc: "Validate config (VRAM budgets, cross-references, TNAP, YAML)"
    cmds:
      - "{{.VENV_PYTHON}} -m registry.validate"

  test:infra:
    desc: "Run infrastructure validation tests (registry, setup modules)"
    cmds:
      - "{{.VENV_PYTHON}} -m pytest tests/test_registry.py tests/test_infra_setup.py -v"

  test:e2e:
    desc: "Run full E2E tests (models on disk, repos cloned, venvs working)"
    cmds:
      - "{{.VENV_PYTHON}} -m pytest tests/test_e2e_setup.py -v"

  test:integration:
    desc: "Run service integration tests (LLM, TTS, ASR, 3D, music, ComfyUI) — requires running cluster"
    cmds:
      - "{{.VENV_PYTHON}} -m pytest tests/integration/test_full_pipeline.py -v {{.CLI_ARGS}}"

  # ── Video Editor ──────────────────────────────────────────────────────────
  editor:dev:
    desc: "Start video editor dev server (Vite HMR, proxies API to :30080)"
    dir: web/editor
    cmds:
      - pnpm dev

  studio:dev:
    desc: "Start wan2gp-studio-web dev server (Next.js, proxies API to :30080)"
    dir: mcp/wan2gp-studio-web
    cmds:
      - pnpm dev

  studio:build:
    desc: "Build wan2gp-studio-web for production"
    dir: mcp/wan2gp-studio-web
    cmds:
      - pnpm build

  dev:
    desc: "Start all dev servers (editor + studio)"
    cmds:
      - task: editor:dev
      - task: studio:dev

  editor:build:
    desc: "Build video editor SPA to gateway/editor/"
    dir: web/editor
    sources:
      - src/**/*
      - index.html
      - vite.config.ts
      - package.json
    generates:
      - ../../gateway/editor/index.html
    cmds:
      - pnpm build

  editor:prod:
    desc: "Build editor + serve production build locally at :4173"
    dir: web/editor
    cmds:
      - task: editor:build
      - pnpm preview

  # ── Cloud Burst (SkyPilot) ──────────────────────────────────────────────
  cloud:setup:
    desc: "Install SkyPilot and verify cloud provider access"
    cmds:
      - bash infra/skypilot/setup.sh

  cloud:up:
    desc: "Launch SkyServe cloud endpoint"
    cmds:
      - sky serve up infra/skypilot/serve.yaml --endpoint-name forge-cloud

  cloud:down:
    desc: "Terminate SkyServe cloud endpoint"
    cmds:
      - sky serve down forge-cloud

  cloud:status:
    desc: "Show SkyServe status + live GPU prices"
    cmds:
      - sky serve status
      - sky show-gpus RTX4090 A10G L4 A100 --all-regions

  cloud:prices:
    desc: "Show live GPU prices across all providers"
    cmds:
      - sky show-gpus RTX4090 A100 L4 A10G

  cloud:push:
    desc: "Push Docker images to GHCR for cloud burst"
    cmds:
      - bash infra/docker/push-images.sh

  cloud:enable:
    desc: "Enable cloud burst (set CLOUD_SERVE_URL in k8s)"
    cmds:
      - kubectl -n infra set env deploy/overflow-gateway CLOUD_SERVE_URL={{.CLI_ARGS}}
      - kubectl -n infra rollout status deploy/overflow-gateway

  cloud:disable:
    desc: "Disable cloud burst (clear CLOUD_SERVE_URL in k8s)"
    cmds:
      - kubectl -n infra set env deploy/overflow-gateway CLOUD_SERVE_URL=""
      - kubectl -n infra rollout status deploy/overflow-gateway

  cloud:config:
    desc: "Show current overflow gateway runtime config"
    cmds:
      - curl -s http://localhost:30080/overflow/config

  cloud:metrics:
    desc: "Fetch overflow gateway Prometheus metrics"
    cmds:
      - curl -s http://localhost:30080/overflow/metrics

  cloud:tune:
    desc: "Tune gateway runtime config  eg: task cloud:tune '{\"local_timeout\":5}'"
    cmds:
      - "curl -s -X POST http://localhost:30080/overflow/config -H 'Content-Type: application/json' -d '{{.CLI_ARGS}}'"

  cloud:logs:
    desc: "Stream SkyServe cloud logs"
    cmds:
      - sky serve logs forge-cloud
