# Git Sidecar version pinning.
#
# Pinned repos stay at a fixed tag/commit and never auto-update.
# Unpinned repos track origin/master and auto-pull on every cycle.
#
# Pin format: <repo_dir_name>: <ref>
#   ref can be: a tag ("v1.5.0"), branch ("stable"), or commit SHA ("abc1234")
#
# Empty file = all repos track master (default behavior).

pins: {}
