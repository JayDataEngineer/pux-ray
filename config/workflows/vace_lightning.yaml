name: vace_lightning
version: "1.2"
description: >
  PENDING: Wan2.1 VACE 14B 4-step Lightning mode. Investigation found the
  LightX2V LoRA (hf://lightx2v/Wan2.2-Distill-Loras) targets Wan2.2-I2V-A14B,
  not Wan2.1-VACE-14B — the LoRA merge produced washed-out output (std~12 vs
  ~72 for base). The vace_lightning workflow + run_omni_14b_lightning.sh IaC
  are kept ready for when a compatible Wan2.1-VACE distillation source is
  available. Until then, use vace_fast (base FP8 with 10 steps) for a ~2.5x
  speedup over the 25-step base.

inputs:
  prompt:
    type: string
    required: true
    description: "Text prompt for video content"
  cond_image:
    type: string
    required: false
    description: "Base64 conditioning image (VACE I2V mode)"
  negative_prompt:
    type: string
    default: ""
  seed:
    type: integer
    default: -1
  width:
    type: integer
    default: 640
  height:
    type: integer
    default: 480
  frames:
    type: integer
    default: 33
    description: "Number of frames"
  steps:
    type: integer
    default: 4
    description: "Denoising steps (4 for Lightning/Turbo)"
  guidance:
    type: string
    default: "3.0"
  fps:
    type: integer
    default: 16

steps:
  generate:
    type: vace_generate
    model: wan2.1-vace-14b-fp8-lightning
    params:
      input_prompt: "{{ inputs.prompt }}"
      image_b64: "{{ inputs.cond_image }}"
      n_prompt: "{{ inputs.negative_prompt }}"
      seed: "{{ inputs.seed }}"
      width: "{{ inputs.width }}"
      height: "{{ inputs.height }}"
      frame_num: "{{ inputs.frames }}"
      sampling_steps: "{{ inputs.steps }}"
      guide_scale: "{{ inputs.guidance }}"
      fps: "{{ inputs.fps }}"
    outputs:
      video: { media_type: video/mp4 }
