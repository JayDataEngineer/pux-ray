name: vnccs_pose_studio
version: "1.0"
description: Character image + pose reference → posed character (VNCCS Pose Studio)

inputs:
  character_image:
    type: string
    required: true
    description: "Base64-encoded character image to re-pose"
  pose_image:
    type: string
    required: false
    description: "Base64-encoded reference pose image. If omitted, uses default T-pose"
  seed:
    type: integer
    default: 42

steps:
  extract_pose_skeleton:
    type: forge
    service: wan2gp
    model: dwpose
    params:
      image_b64: "{{ inputs.pose_image }}"
    outputs:
      skeleton: { media_type: image/png }
    condition: "{{ inputs.pose_image is defined and inputs.pose_image }}"

  render_tpose_skeleton:
    type: forge
    service: wan2gp
    model: body_mesh
    params:
      rotations: {}
    outputs:
      skeleton: { media_type: image/png }
    condition: "{{ inputs.pose_image is not defined or not inputs.pose_image }}"

  pose_transfer:
    type: forge
    service: wan2gp
    model: qwen-image-edit
    depends_on: [extract_pose_skeleton, render_tpose_skeleton]
    params:
      input_prompt: >-
        Match the body pose shown in Picture 1 (pose reference).
        Picture 2 is the character to draw. Picture 3 shows the skeleton overlay.
        Replicate the exact pose, limb positions, and body orientation from Picture 1
        while maintaining the character's identity, clothing, and appearance.
      reference_images:
        - "{{ inputs.pose_image if inputs.pose_image else render_tpose_skeleton.outputs.skeleton }}"
        - "{{ inputs.character_image }}"
        - "{{ extract_pose_skeleton.outputs.skeleton if extract_pose_skeleton.status == 'completed' else render_tpose_skeleton.outputs.skeleton }}"
      seed: "{{ inputs.seed }}"
      sampling_steps: 4
      guide_scale: 1.0
      loras_selected:
        - "Qwen-Image-Edit-2511-Lightning-4steps-V1.0-bf16.safetensors"
        - "VNCCS/VNCCS_PoseStudioQIE2511_V2.safetensors"
    outputs:
      image: { media_type: image/png }
