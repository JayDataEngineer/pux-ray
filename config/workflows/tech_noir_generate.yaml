name: tech_noir_generate
version: "1.0"
description: Z-Image character generation from text prompt

inputs:
  prompt:
    type: string
    required: true
    description: "Character description"
  model:
    type: string
    default: "z_image"
    enum: [z_image, z_image_base]
    description: "Model variant — z_image (turbo, 8 steps) or z_image_base (standard, 50 steps)"
  seed:
    type: integer
    default: 42
  negative_prompt:
    type: string
    default: "blurry, low quality, deformed, bad anatomy"
    description: "Negative prompt. Ignored by Turbo (z_image). Only used by Base (z_image_base)."
  width:
    type: integer
    default: 1024
  height:
    type: integer
    default: 1024

steps:
  generate:
    type: forge
    service: wan2gp
    model: "{{ inputs.model }}"
    params:
      input_prompt: "{{ inputs.prompt }}"
      n_prompt: "{{ inputs.negative_prompt }}"
      seed: "{{ inputs.seed }}"
      sampling_steps: 8
      guide_scale: 0.0
      width: "{{ inputs.width }}"
      height: "{{ inputs.height }}"
    outputs:
      image: { media_type: image/png }
