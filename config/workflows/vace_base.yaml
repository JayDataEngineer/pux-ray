name: vace_base
version: "1.1"
description: >
  Wan2.1 VACE 14B FP8 — full quality video generation (PROVEN on RTX 4090).
  Text-to-video / image-to-video with VACE conditioning.
  Uses vLLM-Omni 0.22 with FP8 weight-only patch (FP8 storage + BF16 matmul).
  ~2:45 for 33-frame 640x480 at 25 steps; ~5-7 min for 81-frame 832x480.

inputs:
  prompt:
    type: string
    required: true
    description: "Text prompt for video content"
  cond_image:
    type: string
    required: false
    description: "Base64 conditioning image (VACE I2V mode, omit for T2V)"
  negative_prompt:
    type: string
    default: ""
  seed:
    type: integer
    default: -1
  width:
    type: integer
    default: 640
  height:
    type: integer
    default: 480
  frames:
    type: integer
    default: 33
    description: "Number of frames (33 safe for 24GB VRAM at 640x480)"
  steps:
    type: integer
    default: 25
    description: "Denoising steps (25 for Base — good quality/speed tradeoff)"
  guidance:
    type: string
    default: "5.0"
  fps:
    type: integer
    default: 16

steps:
  generate:
    type: vace_generate
    model: wan2.1-vace-14b-fp8-diffusers
    params:
      input_prompt: "{{ inputs.prompt }}"
      image_b64: "{{ inputs.cond_image }}"
      n_prompt: "{{ inputs.negative_prompt }}"
      seed: "{{ inputs.seed }}"
      width: "{{ inputs.width }}"
      height: "{{ inputs.height }}"
      frame_num: "{{ inputs.frames }}"
      sampling_steps: "{{ inputs.steps }}"
      guide_scale: "{{ inputs.guidance }}"
      fps: "{{ inputs.fps }}"
    outputs:
      video: { media_type: video/mp4 }
