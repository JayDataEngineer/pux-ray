name: vace_base
version: "1.3"
description: >
  Wan2.1 VACE 14B FP8 — full quality video generation (PROVEN on RTX 4090).
  Text-to-video / image-to-video with VACE conditioning.
  Uses vLLM-Omni 0.22 with FP8 weight-only patch (FP8 storage + BF16 matmul).

  Verified 24GB VRAM ceilings (--cpu-offload-gb 20):
    * 640x480 x 81 frames x 25 steps: WORKS (~510s, 5-second video)
    * 640x480 x 33 frames x 25 steps: WORKS (~165s, default)
    * 704x480 x 33 frames: WORKS (~120s)
    * 720x480 and above: OOM (use vace_fast with fewer steps if needed)

  TeaCache (Timestep Embedding Aware Cache) is available server-side.
  When enabled on the container (OMNI_TEACACHE_THRESH=0.01), this 25-step
  workflow runs in ~49s instead of ~165s (70% speedup) with negligible
  quality impact (std ~83 vs baseline ~84).

  Defaults below (33 frames @ 25 steps) give the best speed/quality
  tradeoff and a 2-second clip at 16 fps.

inputs:
  prompt:
    type: string
    required: true
    description: "Text prompt for video content"
  cond_image:
    type: string
    required: false
    description: "Base64 conditioning image (VACE I2V mode, omit for T2V)"
  negative_prompt:
    type: string
    default: ""
  seed:
    type: integer
    default: -1
  width:
    type: integer
    default: 640
  height:
    type: integer
    default: 480
  frames:
    type: integer
    default: 33
    description: "Number of frames (33 safe at 640x480; 81 verified for 5s clips)"
  steps:
    type: integer
    default: 25
    description: "Denoising steps (25 for Base — good quality/speed tradeoff)"
  guidance:
    type: string
    default: "5.0"
  fps:
    type: integer
    default: 16

steps:
  generate:
    type: vace_generate
    model: wan2.1-vace-14b-fp8-diffusers
    params:
      input_prompt: "{{ inputs.prompt }}"
      image_b64: "{{ inputs.cond_image }}"
      n_prompt: "{{ inputs.negative_prompt }}"
      seed: "{{ inputs.seed }}"
      width: "{{ inputs.width }}"
      height: "{{ inputs.height }}"
      frame_num: "{{ inputs.frames }}"
      sampling_steps: "{{ inputs.steps }}"
      guide_scale: "{{ inputs.guidance }}"
      fps: "{{ inputs.fps }}"
    outputs:
      video: { media_type: video/mp4 }
