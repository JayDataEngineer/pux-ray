name: img_edit
version: "1.0"
description: >
  Qwen-Image-Edit-2511 — instruction-based image editing (PROVEN on RTX 4090).

  TWO server profiles:
    1. BF16 + Cache-DiT + layerwise offload (run_omni_qwen_img_edit.sh)
       ~21.6s per edit at 1024x1024 40 steps. Uses CPU↔GPU weight swapping.
       VRAM: 22 GB. Container: omni-qwen-img-edit (port 8092).

    2. FP8 weight-only + Cache-DiT (run_omni_qwen_img_edit_fp8.sh)  ★ RECOMMENDED
       ALL 60 DiT blocks resident on GPU — no layerwise offload overhead.
       ~2-3x faster than BF16 path. Text encoder on CPU (~14GB freed).
       VRAM: 23 GB. Container: omni-qwen-img-edit-fp8 (port 8093).

  Uses the OpenAI DALL-E compatible /v1/images/edits endpoint. Accepts a
  single input image and an edit instruction prompt.

  Model routing:
    model=qwen-image-edit-2511     → BF16 + layerwise offload (slow path)
    model=qwen-image-edit-2511-fp8 → FP8 weight-only (fast path)

inputs:
  prompt:
    type: string
    required: true
    description: "Edit instruction (e.g., 'add a blue hat', 'make it night')"
  image_b64:
    type: string
    required: true
    description: "Base64-encoded input image (PNG)"
  image_b64_2:
    type: string
    required: false
    description: "Optional second image for multi-image composition (2511 only)"
  negative_prompt:
    type: string
    default: ""
  seed:
    type: integer
    default: -1
  width:
    type: integer
    default: 1024
  height:
    type: integer
    default: 1024
  steps:
    type: integer
    default: 40
    description: "Denoising steps (10-50; 40 is default for quality)"
  guidance:
    type: float
    default: 1.5
    description: "CFG guidance scale (distilled model default: 1.5)"
  mask_b64:
    type: string
    required: false
    description: "Base64-encoded mask (white=edit region)"

steps:
  edit:
    type: img_edit
    model: qwen-image-edit-2511
    params:
      input_prompt: "{{ inputs.prompt }}"
      image_b64: "{{ inputs.image_b64 }}"
      image_b64_2: "{{ inputs.image_b64_2 }}"
      n_prompt: "{{ inputs.negative_prompt }}"
      seed: "{{ inputs.seed }}"
      width: "{{ inputs.width }}"
      height: "{{ inputs.height }}"
      sampling_steps: "{{ inputs.steps }}"
      guidance_scale: "{{ inputs.guidance }}"
      mask_b64: "{{ inputs.mask_b64 }}"
    outputs:
      image: { media_type: image/png }
