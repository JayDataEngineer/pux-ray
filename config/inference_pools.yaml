# ════════════════════════════════════════════════════════════════════════════
# Tech Noir — Inference Pool System (4-tier priority fallback)
# ════════════════════════════════════════════════════════════════════════════
# Replaces the monolithic "all-in-one" gpu-all docker with four independent
# serving tiers. Pools are tried in priority order at request time; the first
# healthy pool that serves a model wins.
#
# Tier A — Specialized dockers (one per service, mostly upstream images)
#          Highest priority. Each model gets a dedicated docker.
#          MOSS, Diarization, llama.cpp (upstream + BeeLlama fork), ComfyUI
#
# Tier B — Omni vLLM (single vllm/vllm-omni docker, multi-model)
#          All Diffusion Transformer (DiT) models: Qwen-Image-Edit FP8,
#          Wan VACE 14B FP8, Z-Image, Wan T2V/I2V, Cosmos3-Nano.
#          Custom FP8-weight-only patches bind-mounted over in-image pipeline.
#
# Tier C — SGLang (single lmsysorg/sglang docker)
#          Ideogram4 + alternative Z-Image/LTX-Video serving for fallback.
#
# Tier D — Diffusers generalized (single tech-noir/gpu-all docker)
#          Catch-all for CPU-friendly and small models: Kimodo, ACE-Step,
#          Kokoro, IndexTTS, VibeVoice, etc.
#
# Models may be served by multiple pools; the routes: table defines the
# priority order per model. Resolution is data-driven from this file — no
# Python changes required to add or relocate a model.
#
# ════════════════════════════════════════════════════════════════════════════
# Registry cross-reference:
#   Physical model metadata (size, source, path, VRAM) lives in
#   config/model_registry.yaml under the "served-models:" section.
#   The `registry_ref:` field below links pool launchers to that section.
# ════════════════════════════════════════════════════════════════════════════

# ─── Defaults ────────────────────────────────────────────────────────────────
defaults:
  host: 127.0.0.1
  health_timeout_s: 180        # max wait for /health on cold boot
  health_interval_s: 2         # poll interval during boot
  vram_total_mb: 24576         # RTX 4090 (24 GB)
  vram_reserved_mb: 2048       # OS/display + safety margin
  models_root: /mnt/data/models

# ─── Pools (4 tiers, priority = boot + resolution order) ─────────────────────
pools:

  # ══════════════════════════════════════════════════════════════════════════
  # TIER A — Specialized dockers (one per service)
  # ══════════════════════════════════════════════════════════════════════════
  moss:
    tier: A
    priority: 10
    image: forge-reg.local:30500/tech-noir/moss:latest
    container: inference-moss
    port: 8050
    framework: moss
    description: >-
      MOSS Audio — TTS + Sound Effects. All TTS models handled by the MOSS Docker.
      Model data (GGUF format) is managed inside the container or mounted externally.
      Dispatch routes all moss-* model names here; the Docker resolves internally.
    models:
      - moss-tts
      - moss-ttsd
      - moss-soundeffect
      - moss-soundeffect-v2
      - moss-tts-realtime
      - moss-tts-local-transformer
      - moss-voicegenerator
      - moss-tts-nano
    vram_mb: 6000
    health_path: /health
    volumes:
      /models/audio: /mnt/data/models/audio
    env:
      HF_HOME: /models/hf-cache
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

  diarization:
    tier: A
    priority: 20
    image: forge-reg.local:30500/tech-noir/asr:latest
    container: inference-diarization
    port: 8051
    framework: crispasr
    description: >-
      CrispASR — C++ ASR + speaker diarization (crispstrobe/CrispASR).
      Base image: ghcr.io/crispstrobe/crispasr:main-cuda-12 (upstream, unmodified).
      Our Dockerfile: infra/docker/Dockerfile.asr.
      MODE: base — VibeVoice-7B Q4_K, 9.19% DER, joint ASR + diarization.
      API: POST /v1/audio/transcriptions (OpenAI-compatible multipart).
    models: [diarization, diarization-base, whisper, faster-whisper]
    vram_mb: 1500
    health_path: /health
    volumes:
      /models/vibevoice-cpp: /mnt/data/models/vibevoice-cpp
      /models/asr: /mnt/data/models/asr
    env:
      CRISPASR_MODEL: /models/vibevoice-cpp/vibevoice-asr-q4_k.gguf
      CRISPASR_BACKEND: vibevoice
    model_launchers:
      diarization-base:
        model_dir: /mnt/data/models/vibevoice-cpp/vibevoice-asr-q4_k.gguf
        api:
          transcribe: POST /v1/audio/transcriptions
        note: VibeVoice-7B Q4_K — joint ASR + diarization, 9.19% DER

  diarization-turbo:
    tier: A
    priority: 21
    image: forge-reg.local:30500/tech-noir/asr:latest
    container: inference-diarization-turbo
    port: 8055
    framework: crispasr
    description: >-
      CrispASR — turbo mode. VibeVoice-Realtime 0.5B Q8_0 for low-latency
      streaming ASR + diarization. Separate container from base — both can run
      concurrently (1.5GB VRAM each).
      API: POST /v1/audio/transcriptions (OpenAI-compatible multipart).
    models: [diarization-turbo]
    vram_mb: 1500
    health_path: /health
    volumes:
      /models/vibevoice-cpp: /mnt/data/models/vibevoice-cpp
    env:
      CRISPASR_MODEL: /models/vibevoice-cpp/vibevoice-realtime-0.5B-q8_0.gguf
      CRISPASR_BACKEND: vibevoice
    model_launchers:
      diarization-turbo:
        model_dir: /mnt/data/models/vibevoice-cpp/vibevoice-realtime-0.5B-q8_0.gguf
        api:
          transcribe: POST /v1/audio/transcriptions
        note: VibeVoice-Realtime 0.5B Q8_0 — low-latency streaming ASR + diarization

  llama:
    tier: A
    priority: 30
    image: forge-reg.local:30500/tech-noir/gpu-all:latest
    container: inference-llama
    port: 8052
    framework: llama.cpp
    description: Upstream llama.cpp server (ggml-org/llama.cpp stable)
    models: [llama]
    vram_mb: 4000
    health_path: /health
    start_args:
      binary: llama-server-upstream
      # model + quant set at runtime via /configure
    volumes:
      /models: /mnt/data/models

  llama-bee:
    tier: A
    priority: 40
    image: forge-reg.local:30500/tech-noir/gpu-all:latest
    container: inference-llama-bee
    port: 8053
    framework: beellama
    description: BeeLlama.cpp (Anbeeld fork) — DFlash + TurboQuant KV cache
    models: [llama-bee]
    vram_mb: 4000
    health_path: /health
    start_args:
      binary: llama-server           # beellama fork binary
    volumes:
      /models: /mnt/data/models

  ace-step:
    tier: A
    priority: 45
    image: forge-reg.local:30500/tech-noir/ace-step:latest
    container: inference-ace-step
    port: 8056
    framework: acetep-cpp
    description: >-
      ACE-Step C++ music generation (ServeurpersoCom/acestep.cpp). GGUF models.
      Two-step API: POST /lm (generate music codes) → POST /synth (render audio).
      Turbo (8-step) vs Base/SFT (50-step) selected per request via DiT model name.
      Dockerfile: infra/docker/Dockerfile.acetep.
    models: [ace-step, ace-step-turbo, ace-step-xl-turbo, ace-step-xl-sft, ace-step-xl-base]
    vram_mb: 8000
    health_path: /health
    volumes:
      /models/audio/acestep-cpp: /mnt/data/models/audio/acestep-cpp
    model_launchers:
      ace-step:
        api:
          generate: POST /lm
          synth: POST /synth
        note: "SFT DiT 50-step (high quality). Use dit_model=acestep-v15-sft-Q8_0 in /lm request."
      ace-step-turbo:
        api:
          generate: POST /lm
          synth: POST /synth
        note: "Turbo DiT 8-step (fast). Use dit_model=acestep-v15-turbo-Q8_0 in /lm request."
      ace-step-xl-turbo:
        registry_ref: served-models/ace-step-xl-turbo
        api:
          generate: POST /lm
          synth: POST /synth
        note: "XL Turbo 4B DiT 8-step. Use dit_model=acestep-v15-xl-turbo-Q8_0 in /lm request."
      ace-step-xl-sft:
        registry_ref: served-models/ace-step-xl-sft
        api:
          generate: POST /lm
          synth: POST /synth
        note: "XL SFT 4B DiT 50-step. Use dit_model=acestep-v15-xl-sft-Q8_0 in /lm request."
      ace-step-xl-base:
        registry_ref: served-models/ace-step-xl-base
        api:
          generate: POST /lm
          synth: POST /synth
        note: "XL Base 4B DiT. Use dit_model=acestep-v15-xl-base-Q8_0 in /lm request."

  comfyui:
    tier: A
    priority: 50
    image: forge-reg.local:30500/tech-noir/gpu-all:latest
    container: inference-comfyui
    port: 8054
    framework: comfyui
    description: ComfyUI — node-based image/video pipeline
    models: [comfyui]
    vram_mb: 8000
    health_path: /system_stats
    volumes:
      /models: /mnt/data/models
      /ComfyUI/output: /mnt/data/comfyui-output

  # ══════════════════════════════════════════════════════════════════════════
  # TIER B — Omni vLLM (single docker, multi-model DiT serving)
  # ══════════════════════════════════════════════════════════════════════════
  omni-vllm:
    tier: B
    priority: 100
    image: vllm/vllm-omni:latest
    container: inference-omni-vllm
    port: 8093
    framework: vllm-omni
    description: vLLM-Omni 0.22 — Diffusion Transformer serving with FP8 weight-only
    models:
      - qwen-image-edit          # 20B MMDiT, FP8 weight-only + Cache-DiT (LOCKED)
      - wan-vace                 # 14B Wan2.1 VACE FP8 + TeaCache
      - wan-t2v                  # Wan2.1 T2V
      - wan-i2v                  # Wan2.1 I2V
      - z-image                  # Z-Image Turbo (8-step) and Base (50-step) — same model
      - z-image-base             # alias: 50-step variant of the same z-image model
      - cosmos                   # Cosmos3-Nano (BF16 CPU offload for now)
      - anima-base               # (future: replaces cosmos slot)
    vram_mb: 22000
    health_path: /health
    # Per-model launch config. The "script" points at an existing launcher
    # that knows how to docker-run the omni image with the right bind-mounts
    # and env vars. The "patch" is bind-mounted over the in-image pipeline.
    model_launchers:
      qwen-image-edit:
        script: scripts/run_omni_qwen_img_edit_fp8.sh
        patch: scripts/pipeline_qwen_image_edit_plus_patch.py
        model_dir: /mnt/data/models/image-gen/qwen-image-edit/2511-fp8
        launcher: scripts/launch_qwen_img_edit_fp8.py
        registry_ref: served-models/qwen-image-edit
        api:
          generate: POST /v1/images/generations
          edit:     POST /v1/images/edits
        optimization:
          quant: fp8-weight-only       # Float8_e4m3fn + BF16 dequant at matmul
          cache_dit: true              # block-level caching
          taylorseer: true             # O(2) calibration for Cache-DiT
          vae_tiling: true
          vae_slicing: true
          fn_compute_blocks: 1
          bn_compute_blocks: 0
          max_warmup_steps: 4
        benchmark:
          - { steps: 4,  time_s: 8.6,  note: "Lightning distilled" }
          - { steps: 20, time_s: 23.5, note: "Cache-DiT acceleration" }
      wan-vace:
        script: scripts/run_omni_14b.sh
        patch: scripts/pipeline_wan2_2_vace_patch.py
        model_dir: /mnt/data/models/video/wan2.1-vace-14b-fp8-diffusers
        registry_ref: served-models/wan-vace
        api:
          generate: POST /v1/videos/generations
        optimization:
          quant: fp8-weight-only
          teacache_thresh: 0.01        # ~70% speedup, quality-preserving
          cpu_offload_gb: 20
      z-image:
        script: scripts/run_omni_z_image_fp8.sh
        patch: scripts/pipeline_z_image_patch.py
        shared_patch: scripts/fp8_weight_only_patch.py
        model_dir: /mnt/data/models/native/z-image-turbo-fp8
        registry_ref: served-models/z-image
        api:
          generate: POST /v1/images/generations
        optimization:
          quant: fp8-weight-only
          cache_dit: true
          taylorseer: true
          vae_tiling: true
          vae_slicing: true
          fn_compute_blocks: 1
          bn_compute_blocks: 0
          max_warmup_steps: 4
      z-image-base:              # Same architecture as z-image-turbo but different (non-distilled) weights
        script: scripts/run_omni_z_image_fp8.sh
        patch: scripts/pipeline_z_image_patch.py
        shared_patch: scripts/fp8_weight_only_patch.py
        model_dir: /mnt/data/models/native/z-image-base-fp8
        registry_ref: served-models/z-image-base
        api:
          generate: POST /v1/images/generations
        optimization:
          quant: fp8-weight-only
          cache_dit: true
          taylorseer: true
          vae_tiling: true
          vae_slicing: true
          fn_compute_blocks: 1
          bn_compute_blocks: 0
          max_warmup_steps: 4
        note: "Same omni-vllm pipeline as z-image-turbo but non-distilled base checkpoint. 50-step, higher quality."
      wan-t2v:
        script: scripts/run_omni_wan_t2v.sh
        api:
          generate: POST /v1/videos/generations
      wan-i2v:
        script: scripts/run_omni_wan_i2v.sh
        api:
          generate: POST /v1/videos/generations
      wan-vace-turbo:
        script: scripts/run_omni_14b_lightning.sh
        patch: scripts/pipeline_wan2_2_vace_patch.py
        model_dir: /mnt/data/models/video/wan2.1-vace-14b-fp8-lightning
        api:
          generate: POST /v1/videos/generations
        optimization:
          quant: fp8-weight-only
          teacache_thresh: 0.01
          cpu_offload_gb: 20
        note: "4-step lightning distilled VACE. Model dir must be pre-built from LightX2V LoRA merge."
      qwen-image-edit-turbo:
        script: scripts/run_omni_qwen_img_edit.sh
        model_dir: /mnt/data/models/image-gen/qwen-image-edit/2511-fp8-lightning
        api:
          generate: POST /v1/images/generations
          edit:     POST /v1/images/edits
        optimization:
          quant: fp8-weight-only
          cache_dit: true
          fn_compute_blocks: 1
          bn_compute_blocks: 0
          max_warmup_steps: 4
        benchmark:
          - { steps: 4, time_s: 5.2, note: "Lightning 4-step" }
        note: "Lightning 4-step distilled. Model dir contains merged Lightning weights."
      cosmos:
        script: scripts/run_omni_cosmos.sh
        model_dir: /mnt/data/models/cosmos3-nano
        registry_ref: served-models/cosmos
        api:
          generate: POST /v1/videos/generations
        optimization:
          quant: bf16-cpu-offload      # FP8 blocked on fused LLM params (SGLang too)
        note: "BF16 with auto CPU offload. FP8 needs newer SGLang for Cosmos3 fused LLM params."
    env:
      VLLM_BATCH_INVARIANT: "1"             # BF16-dequant path for non-patched layers
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      DIFFUSION_VAE_USE_SLICING: "1"
      DIFFUSION_VAE_USE_TILING: "1"
      DIFFUSION_CACHE_BACKEND: cache_dit
      DIFFUSION_CACHE_CONFIG: '{"Fn_compute_blocks": 1, "Bn_compute_blocks": 0, "max_warmup_steps": 4, "enable_taylorseer": true}'

  # ══════════════════════════════════════════════════════════════════════════
  # TIER C — SGLang (single docker)
  # ══════════════════════════════════════════════════════════════════════════
  sglang:
    tier: C
    priority: 200
    image: lmsysorg/sglang:latest
    container: inference-sglang
    port: 8081
    framework: sglang
    description: SGLang — high-throughput diffusion + LLM serving
    models:
      - ideogram4                # typography-aware T2I
      - z-image                  # turbo fallback when omni-vllm is occupied
      - z-image-base             # base fallback when omni-vllm is occupied
      - ltx-video                # LTX-2.3 ModelOpt FP8 two-stage
    vram_mb: 22000
    health_path: /health
    model_launchers:
      ideogram4:
        script: infra/docker/serve_ideogram4.sh
        variant: nf4             # 16 GB on 24 GB card (text_encoder 5.5GB + transformer 5.2GB)
        registry_ref: served-models/ideogram4
        api:
          generate: POST /v1/images/generations
        env_requires: [HF_TOKEN]
        note: "NF4 quantization via bitsandbytes. Presets: V4_DEFAULT_20, V4_QUALITY_48, V4_TURBO_12."
      z-image-base:              # fallback when omni-vllm is occupied
        script: infra/docker/serve_zimage_base_fp8.sh
        model_dir: /mnt/data/models/native/z-image-base-fp8
        registry_ref: served-models/z-image-base
        api:
          generate: POST /v1/images/generations
        optimization:
          quant: fp8
          cache_dit: true
          taylorseer: true
          fn_compute_blocks: 2
          bn_compute_blocks: 1
          warmup_steps: 2
          rdt: 0.5
          mc: 6
        note: "Non-distilled Z-Image checkpoint. 50 steps. SGLang fallback when omni-vllm is occupied."
      z-image:                   # turbo fallback when omni-vllm is busy
        script: infra/docker/serve_zimage_fp8.sh
        variant: sglang
        model_dir: /mnt/data/models/native/z-image-turbo-fp8
        registry_ref: served-models/z-image
        api:
          generate: POST /v1/images/generations
        optimization:
          quant: fp8
          cache_dit: true
          taylorseer: true
          fn_compute_blocks: 2
          bn_compute_blocks: 1
          warmup_steps: 2
          rdt: 0.5
          mc: 6
        benchmark:
          - { steps: 8, time_s: 1.61, note: "RTX 4090, beats MI300X" }
        note: "Turbo Z-Image fallback. Primary is omni-vllm; SGLang used when omni is occupied."
      ltx-video:
        script: infra/docker/serve_ltx23_fp8.sh
        model_dir: /mnt/data/models/native/ltx-2.3-fp8
        registry_ref: served-models/ltx-video
        api:
          generate: POST /v1/videos/generations
        optimization:
          quant: modelopt-fp8     # required: standard FP8 crashes on CPU init
          device_mode: snapshot
      cosmos-sglang:
        script: infra/docker/serve_cosmos3_nano.sh
        model_dir: /mnt/data/models/cosmos3-nano
        api:
          generate: POST /v1/videos/generations
        note: "BF16 CPU offload fallback. FP8 blocked pending SGLang support for Cosmos3 fused LLM params."
    env:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

  # ══════════════════════════════════════════════════════════════════════════
  # TIER D — Diffusers generalized (catch-all fallback docker)
  # ══════════════════════════════════════════════════════════════════════════
  diffusers:
    tier: D
    priority: 300
    image: forge-reg.local:30500/tech-noir/gpu-all:latest
    container: inference-diffusers
    port: 8095
    framework: diffusers
    description: Generalized diffusers + CPU fallback (tech-noir/gpu-all catch-all)
    models:
      - kimodo                   # Viser interactive 3D motion
      - kokoro                   # Kokoro TTS (CPU-capable)
      - vibevoice-tts            # VibeVoice-7B TTS
      - see-through              # See-Through anime layer decomposition
    vram_mb: 8000
    health_path: /health
    volumes:
      /models: /mnt/data/models

# ─── Routes: model → primary pool + fallback chain ───────────────────────────
# Resolution order: primary first, then each fallback in order. A pool is
# skipped if (a) it doesn't actually serve the model, or (b) it's unhealthy.
# A model served by only one pool has an empty fallback list.
routes:
  # ── Tier A — MOSS (all TTS models handled by the MOSS Docker) ──────────────
  moss-tts:                { primary: moss }
  moss-ttsd:               { primary: moss }
  moss-soundeffect:        { primary: moss }
  moss-soundeffect-v2:     { primary: moss }
  moss-tts-realtime:       { primary: moss }
  moss-tts-local-transformer: { primary: moss }
  moss-voicegenerator:     { primary: moss }
  moss-tts-nano:           { primary: moss }
  # ── Tier A — Diarization / Whisper (CrispASR handles all ASR/transcription)
  diarization:             { primary: diarization }        # default = base
  diarization-base:        { primary: diarization }
  diarization-turbo:       { primary: diarization-turbo }
  whisper:                 { primary: diarization }        # CrispASR handles whisper requests
  faster-whisper:          { primary: diarization }        # legacy alias → diarization

  # ── Tier A — LLM / ComfyUI ───────────────────────────────────────────────
  llama:                   { primary: llama }
  llama-bee:               { primary: llama-bee }
  comfyui:                 { primary: comfyui }

  # ── Tier B — DiT models via omni-vllm ────────────────────────────────────
  qwen-image-edit:
    primary: omni-vllm
    fallback: []               # FP8 patch is omni-only; no fallback
  qwen-image-edit-turbo:
    primary: omni-vllm
    fallback: []
  wan-vace:
    primary: omni-vllm
    fallback: []
  wan-vace-turbo:
    primary: omni-vllm
    fallback: []
  wan-t2v:                 { primary: omni-vllm }
  wan-i2v:                 { primary: omni-vllm }
  z-image:
    primary: omni-vllm
    fallback: [sglang]         # SGLang turbo fallback when omni is occupied
  z-image-base:
    primary: omni-vllm         # same pipeline, different (non-distilled) weights
    fallback: [sglang]         # SGLang base fallback when omni is occupied
  cosmos:
    primary: omni-vllm
    fallback: [sglang]         # SGLang BF16 fallback
  anima-base:              { primary: omni-vllm }

  # ── Tier A — ACE-Step C++ (acestep.cpp, two-step /lm → /synth API) ─────────
  ace-step:                { primary: ace-step }
  ace-step-turbo:          { primary: ace-step }
  ace-step-xl-turbo:       { primary: ace-step }
  ace-step-xl-sft:         { primary: ace-step }
  ace-step-xl-base:        { primary: ace-step }

  # ── Tier C — SGLang-exclusive (or SGLang-primary) ─────────────────────────
  ideogram4:               { primary: sglang }
  ltx-video:               { primary: sglang }
  cosmos-sglang:           { primary: sglang }

  # ── Tier D — Diffusers catch-all ─────────────────────────────────────────
  kimodo:                  { primary: diffusers }
  kokoro:                  { primary: diffusers }
  vibevoice-tts:           { primary: diffusers }
  see-through:             { primary: diffusers }
